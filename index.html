  }
  function overlaps(a, b) {
    if (!a || !b) return false;
    return !(a[2] < b[0] || b[2] < a[0] || a[3] < b[1] || b[3] < a[1]);
  }

  function clearLabels() { while (gLabel.firstChild) gLabel.removeChild(gLabel.firstChild); labelBoxes = []; }

  function placeLabel(node, x, y, prio, allowNudge) {
    node.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
    gLabel.appendChild(node);
    var b = bboxAt(node, x, y);
    if (!b) return true;
    if (labelBoxes.some(function (o) { return overlaps(b, o); })) {
      if (allowNudge) {
        var offs = [[0, -15], [0, 17], [-24, 0], [24, 0], [0, -30], [0, 32], [-38, -12], [38, 12]];
        for (var i = 0; i < offs.length; i++) {
          var nx = x + offs[i][0], ny = y + offs[i][1];
          node.setAttribute('transform', 'translate(' + nx.toFixed(1) + ',' + ny.toFixed(1) + ')');
          var b2 = bboxAt(node, nx, ny);
          if (b2 && !labelBoxes.some(function (o) { return overlaps(b2, o); })) { labelBoxes.push(b2); return true; }
        }
      }
      gLabel.removeChild(node);
      return false;
    }
    labelBoxes.push(b);
    return true;
  }

  function countryLabel(en, zh, rank) {
    var g = mk('g', { 'class': 'country-label rank-' + rank });
    var t1 = mk('text', { 'class': 'label-en', y: '-0.42em' });
    t1.textContent = en;
    var t2 = mk('text', { 'class': 'label-zh', y: '1.02em' });
    t2.textContent = zh || '';
    g.appendChild(t1); g.appendChild(t2);
    return g;
  }

  function layoutLabels() {
    clearLabels();
    if (!st.labels) return;
    /* labels live in the un-transformed root layer: apply the viewport transform
       manually so they track pan / zoom while keeping a constant screen size */
    function mapPt(lon, lat) {
      var s = toSvg(lon, lat);
      return [s[0] * st.k + st.tx, s[1] * st.k + st.ty];
    }
    var era = st.era;
    var ro = REG.map(function (r) { return r.o[era]; });
    var present = {}, order = [];
    REG.forEach(function (r, i) {
      var e = r.o[era];
      if (present[e] === undefined) { present[e] = 1; order.push(e); }
    });
    var cands = [];
    Object.keys(present).forEach(function (k) {
      var e = D.entities[k];
      if (!e) return;
      cands.push({ prio: e.rank, kind: 'country', e: e });
    });
    /* frames */
    var activeFrames = D.frames.filter(function (f) { return st.year >= f.from && st.year <= f.to; });
    activeFrames.forEach(function (f) {
      var g = mk('g', { 'class': 'group-frame-label' });
      var t1 = mk('text', { y: '-0.4em' }); t1.textContent = f.en;
      var t2 = mk('text', { y: '1.0em', 'font-size': '8.5px' }); t2.textContent = f.zh || '';
      g.appendChild(t1); g.appendChild(t2);
      var s = mapPt(f.anchor[0], f.anchor[1]);
      cands.push({ prio: 1.5, kind: 'frame', node: g, x: s[0], y: s[1] });
    });
    cands.sort(function (a, b) { return a.prio - b.prio; });
    cands.forEach(function (c) {
      if (c.kind === 'country') {
        /* confederation / empire aggregates carry a dedicated frame label instead */
        if (c.e.id === 'germany' || c.e.id === 'ngc') return;
        if (c.e.rank === 3 && st.labelMode === 'auto' && st.k < 1.35) return;
        var s = mapPt(c.e.anchor[0], c.e.anchor[1]);
        if (s[0] < -40 || s[0] > W + 40 || s[1] < -20 || s[1] > H + 20) return;
        placeLabel(countryLabel(c.e.label, c.e.zh, c.e.rank), s[0], s[1], c.prio, true);
      } else if (c.kind === 'frame') {
        if (c.x < -40 || c.x > W + 40 || c.y < -20 || c.y > H + 20) return;
        placeLabel(c.node, c.x, c.y, c.prio, true);
      }
    });
    /* cities + battles */
    (D.cities || []).forEach(function (c) {
      var battle = (c.kind === 'battle' || c.kind === 'siege');
      if (battle) {
        if (c.year == null || Math.abs(c.year - st.year) > 2) return;
      }
      var s = mapPt(c.lon, c.lat);
      if (s[0] < -30 || s[0] > W + 30 || s[1] < -20 || s[1] > H + 20) return;
      if (battle) {
        var g = mk('g');
        var cir = mk('circle', { 'class': 'battle-marker', r: '3.4', cx: 0, cy: 0 });
        var l1 = mk('path', { d: 'M-2.2,-2.2 L2.2,2.2 M2.2,-2.2 L-2.2,2.2', stroke: '#f8f2e4', 'stroke-width': '1.1' });
        g.appendChild(cir); g.appendChild(l1);
        var lbl = mk('text', { 'class': 'battle-label', x: '6', y: '3.4' });
        lbl.textContent = c.nameEn + ' ' + c.year;
        g.appendChild(lbl);
        placeLabel(g, s[0], s[1], 6, false);
      } else {
        if (st.k >= 1.25) {
          var dot = mk('circle', { 'class': 'city-dot', r: '1.9', cx: s[0], cy: s[1] });
          gLabel.appendChild(dot);
        }
        if (st.k >= 1.6 && (c.nameEn.length < 15)) {
          var t = mk('text', { 'class': 'city-label', x: (s[0] + 4).toFixed(1), y: (s[1] + 3).toFixed(1) });
          t.textContent = c.nameEn;
          var b = bboxAt(t, 0, 0);
          if (b && !labelBoxes.some(function (o) { return overlaps(b, o); })) { gLabel.appendChild(t); labelBoxes.push(b); }
        }
      }
    });
    /* sea names last (lowest priority) */
    D.seas.forEach(function (s0) {
      var s = mapPt(s0.lon, s0.lat);
      var t = mk('text', { 'class': 'sea-label' });
      t.textContent = s0.en;
      placeLabel(t, s[0], s[1], 9, false);
    });
  }

  /* ---------------------------------------------------------------- era render */
  var HIDDEN = {};
  function render() {
    var era = st.era, year = st.year;
    var ro = [], gr = [];
    REG.forEach(function (r) { ro.push(r.o[era]); gr.push(r.g[era]); });
    var anyHidden = Object.keys(HIDDEN).length > 0;
    REG.forEach(function (r, i) {
      var e = D.entities[ro[i]];
      var c = e && e.color ? e.color : '#cfc9ba';
      var el = regionEls[i];
      el.setAttribute('fill', anyHidden && HIDDEN[ro[i]] ? '#d9d2c4' : c);
      el.setAttribute('stroke', c);
      el.classList.toggle('is-selected', st.selected !== null && ro[i] === ENT_INDEX[st.selected] && !st.edit);
    });
    /* edges */
    gEdge.style.display = st.borders ? '' : 'none';
    if (st.borders && !st.modified) {
      var activeFrame = null;
      D.frames.forEach(function (f) { if (year >= f.from && year <= f.to) activeFrame = f; });
      var frameIdx = activeFrame ? GROUP_IDS.indexOf(activeFrame.id) : -1;
      for (var i = 0; i < D.edges.length; i++) {
        var a = D.edges[i][0], b = D.edges[i][1], el = edgeEls[i];
        var gA = a >= 0 ? gr[a] : -1, gB = b >= 0 ? gr[b] : -1;
        var stroke, w, dash = 'none', op = 1;
        if (frameIdx >= 0 && (gA === frameIdx || gB === frameIdx) && gA !== gB) {
          stroke = activeFrame.color; w = 1.9; op = 0.95;
        } else if (b < 0) {
          stroke = '#4a4238'; w = 0.5; op = 0.6;
        } else if (ro[a] === ro[b]) {
          stroke = '#6b6255'; w = 0.4; op = 0.55; dash = '2.2 1.8';
        } else {
          stroke = '#332d25'; w = 1.1; op = 0.92;
        }
        el.setAttribute('stroke', stroke);
        el.setAttribute('stroke-width', w);
        el.setAttribute('stroke-opacity', op);
        el.setAttribute('stroke-dasharray', dash);
      }
      D.frames.forEach(function (f) {
        frameEls[f.id].style.display = (year >= f.from && year <= f.to) ? '' : 'none';
      });
      gFrame.style.display = '';
    } else if (st.modified && st.borders) {
      /* borders were edited: precomputed topology is stale — draw region outlines */
      for (var j = 0; j < NR; j++) {
        var e2 = D.entities[ro[j]];
        var col = e2 && e2.color ? e2.color : '#cfc9ba';
        regionEls[j].setAttribute('stroke', '#332d25');
        regionEls[j].setAttribute('stroke-width', '0.75');
      }
      for (var q = 0; q < edgeEls.length; q++) edgeEls[q].setAttribute('stroke-opacity', '0');
      D.frames.forEach(function (f) { frameEls[f.id].style.display = 'none'; });
    } else if (!st.borders) {
      for (var m = 0; m < NR; m++) { regionEls[m].setAttribute('stroke-width', '0'); }
      D.frames.forEach(function (f) { frameEls[f.id].style.display = 'none'; });
    }
    layoutLabels();
    syncPanels();
  }

  /* ---------------------------------------------------------------- transform */
  function applyTransform() {
    viewport.setAttribute('transform', 'translate(' + st.tx.toFixed(2) + ',' + st.ty.toFixed(2) + ') scale(' + st.k.toFixed(4) + ')');
    var r = 3.4 / st.k;
    $$('circle.vertex', gEdit).forEach(function (c) { c.setAttribute('r', r.toFixed(2)); });
  }
  function clientToViewBox(evt) {
    var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function clientToLocal(evt) {
    var v = clientToViewBox(evt);
    return [(v.x - st.tx) / st.k, (v.y - st.ty) / st.k];
  }

  function zoomAt(cx, cy, factor) {
    var k2 = clamp(st.k * factor, 0.9, 14);
    var f = k2 / st.k;
    st.tx = cx - f * (cx - st.tx);
    st.ty = cy - f * (cy - st.ty);
    st.k = k2;
    applyTransform();
    hideLabels();
  }
  var hideTimer = null;
  function hideLabels() {
    gLabel.style.opacity = '0';
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { gLabel.style.opacity = '1'; layoutLabels(); }, 140);
  }

  /* ---------------------------------------------------------------- pan & zoom */
  var drag = null;
  svg.addEventListener('mousedown', function (evt) {
    if (evt.button !== 0) return;
    var target = evt.target;
    if (target.classList && target.classList.contains('vertex')) return;
    var v = clientToViewBox(evt);
    drag = { mode: 'pan', sx: v.x, sy: v.y, tx: st.tx, ty: st.ty, moved: false };
    svg.classList.add('is-panning');
    evt.preventDefault();
  });
  window.addEventListener('mousemove', function (evt) {
    if (vdrag) { moveVertex(evt); return; }
    if (!drag) return;
    var v = clientToViewBox(evt);
    var dx = v.x - drag.sx, dy = v.y - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 2) {
      drag.moved = true;
      st.tx = drag.tx + dx; st.ty = drag.ty + dy;
      applyTransform();
      gLabel.style.opacity = '0';
    }
  });
  window.addEventListener('mouseup', function (evt) {
    if (vdrag) { endVertexDrag(); return; }
    if (!drag) return;
    svg.classList.remove('is-panning');
    if (drag.moved) { gLabel.style.opacity = '1'; layoutLabels(); }
    else { handleClick(evt); }
    drag = null;
  });
  svg.addEventListener('wheel', function (evt) {
    evt.preventDefault();
    var v = clientToViewBox(evt);
    zoomAt(v.x, v.y, evt.deltaY < 0 ? 1.16 : 1 / 1.16);
  }, { passive: false });
  svg.addEventListener('dblclick', function (evt) {
    var v = clientToViewBox(evt);
    zoomAt(v.x, v.y, 1.6);
  });

  /* ---------------------------------------------------------------- hover / click */
  var tooltip = $('#tooltip');
  svg.addEventListener('mousemove', function (evt) {
    if (drag || vdrag) return;
    var t = evt.target;
    if (!t.classList || !t.classList.contains('region')) { tooltip.hidden = true; return; }
    var i = +t.getAttribute('data-i');
    var e = D.entities[REG[i].o[st.era]];
    if (!e) { tooltip.hidden = true; return; }
    tooltip.innerHTML = '<b>' + esc(e.label) + '</b>' + esc(e.zh);
    tooltip.hidden = false;
    var wrap = $('#map-wrap').getBoundingClientRect();
    tooltip.style.left = (evt.clientX - wrap.left) + 'px';
    tooltip.style.top = (evt.clientY - wrap.top) + 'px';
  });
  svg.addEventListener('mouseleave', function () { tooltip.hidden = true; });

  function handleClick(evt) {
    var t = evt.target;
    if (!t.classList || !t.classList.contains('region')) {
      if (!evt.shiftKey) { selectEntity(null); selectRegion(null); }
      return;
    }
    var i = +t.getAttribute('data-i');
    if (st.edit) {
      selectRegion(i);
    } else {
      selectEntity(D.entities[REG[i].o[st.era]].id, i);
    }
  }

  function selectRegion(i) {
    st.selRegion = i;
    while (gEdit.firstChild) gEdit.removeChild(gEdit.firstChild);
    if (i === null || !st.edit) { render(); return; }
    var ring = st.rings[i];
    for (var r = 0; r < ring.length; r++) {
      for (var k = 0; k < ring[r].length; k++) {
        var s = toSvg(ring[r][k][0], ring[r][k][1]);
        var c = mk('circle', { 'class': 'vertex', cx: s[0].toFixed(1), cy: s[1].toFixed(1), r: (3.4 / st.k).toFixed(2) });
        c.setAttribute('data-r', r); c.setAttribute('data-k', k); c.setAttribute('data-reg', i);
        gEdit.appendChild(c);
      }
    }
    render();
  }

  /* ---------------------------------------------------------------- vertex drag */
  var vdrag = null;
  gEdit.addEventListener('mousedown', function (evt) {
    var t = evt.target;
    if (!t.classList || !t.classList.contains('vertex')) return;
    evt.stopPropagation();
    evt.preventDefault();
    var local = clientToLocal(evt);
    var grab = parseFloat(t.getAttribute('cx'));
    var graby = parseFloat(t.getAttribute('cy'));
    var radius = 11 / st.k;
    var affected = [];
    for (var i = 0; i < NR; i++) {
      var rings = projCache[i];
      for (var r = 0; r < rings.length; r++) {
        for (var k = 0; k < rings[r].length; k++) {
          var dx = rings[r][k][0] - grab, dy = rings[r][k][1] - graby;
          if (dx * dx + dy * dy <= radius * radius) affected.push([i, r, k]);
        }
      }
    }
    vdrag = {
      lonlat: toLonLat(local[0], local[1]),
      affected: affected,
      start: affected.map(function (a) { return st.rings[a[0]][a[1]][a[2]].slice(); }),
      moved: false
    };
    svg.classList.add('is-editing');
  });

  function moveVertex(evt) {
    if (!vdrag) return;
    var local = clientToLocal(evt);
    var ll = toLonLat(local[0], local[1]);
    var dlon = ll[0] - vdrag.lonlat[0], dlat = ll[1] - vdrag.lonlat[1];
    if (Math.abs(dlon) + Math.abs(dlat) < 0.008) return;
    vdrag.moved = true;
    var dirty = {};
    vdrag.affected.forEach(function (a, idx) {
      var s = vdrag.start[idx];
      var ring = st.rings[a[0]][a[1]];
      ring[a[2]][0] = s[0] + dlon;
      ring[a[2]][1] = s[1] + dlat;
      dirty[a[0]] = 1;
    });
    Object.keys(dirty).forEach(function (i) {
      refreshRegion(+i);
      regionEls[+i].setAttribute('d', pathOf(+i));
    });
    /* move the visible handles */
    $$('circle.vertex', gEdit).forEach(function (c) {
      var i = +c.getAttribute('data-reg'), r = +c.getAttribute('data-r'), k = +c.getAttribute('data-k');
      var p = projCache[i][r][k];
      c.setAttribute('cx', p[0].toFixed(1));
      c.setAttribute('cy', p[1].toFixed(1));
    });
    st.modified = true;
  }

  function endVertexDrag() {
    if (!vdrag) return;
    if (vdrag.moved) {
      st.undo.push(cloneRings());
      if (st.undo.length > 30) st.undo.shift();
      st.modified = true;
      render();
    }
    vdrag = null;
    svg.classList.add('is-editing');
  }

  /* ---------------------------------------------------------------- panels */
  function syncPanels() { renderInfo(); renderLegend(); syncTimeline(); }

  function renderInfo() {
    var body = $('#info-body');
    if (st.selected === null) {
      body.innerHTML = '<p class="info-empty">點選地圖上的國家，或從右側圖例選取。<br><span style="opacity:.7">Click a country on the map.</span></p>';
      return;
    }
    var e = ENT[st.selected];
    var era = st.era, year = st.year;
    var ro = REG.map(function (r) { return r.o[era]; });
    var gr = REG.map(function (r) { return r.g[era]; });
    var ei = ENT_INDEX[e.id];
    var mine = [];
    REG.forEach(function (r, i) { if (ro[i] === ei) mine.push(i); });
    var html = '';
    html += '<div class="info-name">' + esc(e.formalEn || e.en) + ' <span class="badge">' + year + '</span></div>';
    html += '<div class="info-name-en">' + esc(e.formalZh || e.zh) + '</div>';
    var frameItem = D.frames.filter(function (f) { return year >= f.from && year <= f.to; })[0];
    var inFrame = mine.some(function (i) { return gr[i] >= 0; });
    var status = e.id === 'germany' ? '德意志帝國（1871 年成立）'
      : e.id === 'ngc' ? '北德意志邦聯（1867–1870）'
        : mine.length === 0 ? '此年不存在（或已併入其他國家）'
          : inFrame && frameItem ? '成員邦 · ' + frameItem.zh : '獨立政治實體';
    html += '<div class="info-status">' + esc(status) + '</div>';
    if (e.capitalEn) html += row('首都 Capital', e.capitalEn + (e.capitalZh ? ' ' + e.capitalZh : ''));
    if (e.ruler) html += row('1853 元首', e.ruler);
    if (e.id === 'italy' && year >= 1861) html += row('統一 Unified', '1861（威尼托 1866、羅馬 1870）');
    if (e.id === 'germany') html += row('成立 Foundation', '1871-01-18 · 凡爾賽鏡廳');
    if (mine.length) html += row('疆域 Regions', mine.length + ' 個地塊');
    if (e.notes) html += '<p class="info-notes">' + esc(e.notes) + '</p>';
    body.innerHTML = html;
  }
  function row(k, v) {
    return '<div class="info-row"><span class="info-k">' + esc(k) + '</span><span class="info-v">' +
      esc(v) + '</span></div>';
  }

  function selectEntity(id, regionIdx) {
    st.selected = id;
    if (id === null) { st.selRegion = null; }
    else if (regionIdx === undefined) {
      var ro = REG.map(function (r) { return r.o[st.era]; });
      for (var i = 0; i < NR; i++) if (ro[i] === ENT_INDEX[id]) { regionIdx = i; break; }
    }
    if (regionIdx !== undefined && regionIdx !== null) st.selRegion = regionIdx;
    if (st.edit && regionIdx !== undefined && regionIdx !== null) selectRegion(regionIdx);
    render();
  }

  /* legend */
  var LEGEND_GROUPS = [
    ['Great Powers', '列強', ['uk', 'france', 'prussia', 'austria', 'austria_hungary', 'russia', 'ottoman']],
    ['German states', '德意志諸邦', ['bavaria', 'saxony', 'hanover', 'wuerttemberg', 'baden', 'hesse_kassel',
      'hesse_darmstadt', 'nassau', 'brunswick', 'mecklenburg', 'oldenburg', 'anhalt', 'thuringia',
      'lippe', 'hanse', 'holstein', 'schleswig', 'luxembourg']],
    ['Italian states', '義大利諸邦', ['italy', 'sardinia', 'tuscany', 'modena', 'parma', 'papal', 'two_sicilies']],
    ['Other states', '其他', ['denmark', 'sweden_norway', 'spain', 'portugal', 'switzerland', 'belgium',
      'netherlands', 'greece', 'serbia', 'romania', 'montenegro']]
  ];
  function renderLegend() {
    var box = $('#legend');
    var era = st.era, year = st.year;
    var present = {};
    REG.forEach(function (r) { present[r.o[era]] = 1; });
    var activeFrames = D.frames.filter(function (f) { return year >= f.from && year <= f.to; });
    var html = '';
    LEGEND_GROUPS.forEach(function (grp) {
      var items = grp[2].filter(function (id) { return present[ENT_INDEX[id]]; });
      if (grp[0] === 'Great Powers' && activeFrames.length) items = items.concat(activeFrames.map(function (f) { return 'frame:' + f.id; }));
      if (!items.length) return;
      html += '<div class="legend-group"><div class="legend-group-title">' + esc(grp[0]) + ' · ' + esc(grp[1]) + '</div>';
      items.forEach(function (id) {
        if (id.indexOf('frame:') === 0) {
          var f = FRAME_BY_ID[id.slice(6)];
          html += '<div class="legend-item" role="button" tabindex="0" data-entity="' + f.id + '">' +
            '<span class="legend-swatch" style="background:transparent;border:2px dashed ' + f.color + '"></span>' +
            '<span class="legend-name">' + esc(f.en) + ' ' + esc(f.zh) + '</span></div>';
        } else {
          var e = ENT[id];
          html += '<div class="legend-item" role="button" tabindex="0" data-entity="' + id + '">' +
            '<span class="legend-swatch" style="background:' + e.color + '"></span>' +
            '<span class="legend-name">' + esc(e.en) + ' ' + esc(e.zh) + '</span></div>';
        }
      });
      html += '</div>';
    });
    box.innerHTML = html;
    $$('.legend-item', box).forEach(function (it) {
      it.addEventListener('click', function () { selectEntity(it.getAttribute('data-entity')); });
      it.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectEntity(it.getAttribute('data-entity')); }
      });
    });
  }

  /* timeline */
  var slider = $('#year-slider');
  function syncTimeline() {
    $('#year-value').textContent = st.year;
    $('#era-label').textContent = META.eraLabels[st.era];
    var pct = (st.year - Y0) / (Y1 - Y0) * 100;
    slider.value = st.year;
    slider.style.setProperty('--range-p', pct + '%');
    $$('.tick', $('#era-ticks')).forEach(function (t) {
      t.classList.toggle('is-active', +t.getAttribute('data-year') === st.year);
    });
    $$('.event-item').forEach(function (it) {
      var y = +it.getAttribute('data-year');
      it.classList.toggle('is-active', y >= ERAS[st.era] && y < (ERAS[st.era + 1] || 9999));
    });
    $('#status-left').textContent = st.year + ' · ' + META.eraLabels[st.era];
    $('#status-right').textContent = 'Zoom ' + st.k.toFixed(1) + '×';
  }
  function setYear(y) {
    y = clamp(Math.round(y), Y0, Y1);
    if (y === st.year) return;
    st.year = y; st.era = eraOf(y);
    render();
  }

  function buildTimeline() {
    var box = $('#era-ticks');
    box.innerHTML = '';
    ERAS.forEach(function (y) {
      var t = document.createElement('button');
      t.className = 'tick';
      t.setAttribute('data-year', y);
      t.style.left = ((y - Y0) / (Y1 - Y0) * 100) + '%';
      t.title = y + ' — ' + META.eraLabels[ERAS.indexOf(y)];
      t.addEventListener('click', function () { setYear(y); });
      box.appendChild(t);
    });
    slider.addEventListener('input', function () { setYear(+slider.value); stopPlay(); });
  }

  /* events */
  function buildEvents() {
    var ol = $('#event-list');
    ol.innerHTML = '';
    D.events.forEach(function (ev) {
      var li = document.createElement('li');
      li.className = 'event-item';
      li.setAttribute('data-id', ev.id);
      li.setAttribute('data-year', ev.year);
      li.tabIndex = 0;
      li.innerHTML = '<span class="ev-dot"></span>' +
        '<span class="ev-year">' + esc(ev.dateLabel || ev.year) + '</span>' +
        '<span class="ev-title">' + esc(ev.titleZh) +
        '<span class="ev-title-en">' + esc(ev.titleEn) + '</span></span>';
      li.addEventListener('click', function () { showEvent(ev); });
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showEvent(ev); }
      });
      ol.appendChild(li);
    });
  }
  function showEvent(ev) {
    setYear(ev.year);
    var body = $('#info-body');
    var html = '<div class="info-name">' + esc(ev.titleEn) + ' <span class="badge">' + esc(ev.dateLabel || ev.year) + '</span></div>';
    html += '<div class="info-name-en">' + esc(ev.titleZh) + '</div>';
    html += '<div class="info-status">' + esc(ev.type || 'event') + '</div>';
    html += '<p class="info-notes">' + esc(ev.summaryZh) + '</p>';
    html += '<p class="info-notes">' + esc(ev.detailZh) + '</p>';
    if (ev.terms && ev.terms.length) {
      html += '<div>' + ev.terms.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    body.innerHTML = html;
    $('#info-body').scrollTop = 0;
    st.selected = null;
    renderLegend();
    $$('.region', svg).forEach(function (r) { r.classList.remove('is-selected'); });
  }

  /* ---------------------------------------------------------------- toolbar */
  function btn(name) { return $('[data-action="' + name + '"]'); }
  function setActive(name, on) {
    var b = btn(name); if (!b) return;
    b.classList.toggle('is-active', !!on);
  }
  function doZoom(f) {
    zoomAt(W / 2, H / 2, f);
  }
  function resetView() {
    st.k = 1; st.tx = 0; st.ty = 0; applyTransform(); hideLabels();
  }
  function toggleEdit() {
    st.edit = !st.edit;
    svg.classList.toggle('is-editing', st.edit);
    setActive('toggle-edit', st.edit);
    if (!st.edit) { while (gEdit.firstChild) gEdit.removeChild(gEdit.firstChild); st.selRegion = null; }
    else { $('#map-hint').textContent = '點選國家顯示邊界節點，拖曳節點即可調整疆界'; }
    render();
    if (st.edit && st.selected) selectEntity(st.selected);
  }
  function undo() {
    if (!st.undo.length) return;
    st.rings = st.undo.pop();
    for (var i = 0; i < NR; i++) refreshRegion(i);
    for (var j = 0; j < NR; j++) regionEls[j].setAttribute('d', pathOf(j));
    st.modified = st.undo.length > 0 || st.modified;
    if (!st.undo.length) st.modified = false;
    if (st.selRegion !== null) selectRegion(st.selRegion);
    render();
  }
  function resetBorders() {
    st.rings = cloneRings();
    st.undo = []; st.modified = false;
    for (var i = 0; i < NR; i++) { refreshRegion(i); regionEls[i].setAttribute('d', pathOf(i)); }
    st.selRegion = null;
    while (gEdit.firstChild) gEdit.removeChild(gEdit.firstChild);
    render();
    toast('疆界已還原為 1853–1871 年的歷史重建值');
  }

  $('#toolbar').addEventListener('click', function (evt) {
    var b = evt.target.closest('[data-action]');
    if (!b) return;
    var a = b.getAttribute('data-action');
    if (a === 'zoom-in') doZoom(1.35);
    else if (a === 'zoom-out') doZoom(1 / 1.35);
    else if (a === 'zoom-reset') resetView();
    else if (a === 'toggle-labels') {
      st.labels = !st.labels; setActive('toggle-labels', st.labels);
      layoutLabels();
      if (!st.labels) toast('國名標籤已關閉');
    } else if (a === 'toggle-borders') {
      st.borders = !st.borders; setActive('toggle-borders', st.borders);
      render();
    } else if (a === 'toggle-edit') toggleEdit();
    else if (a === 'undo') undo();
    else if (a === 'reset-borders') resetBorders();
    else if (a === 'export-png') exportPNG();
    else if (a === 'export-json') exportJSON();
    else if (a === 'help') showHelp();
    else if (a === 'toggle-panels') {
      st.panels = !st.panels;
      $('#panel-right').classList.toggle('is-collapsed', !st.panels);
      $('#panel-left').classList.toggle('is-collapsed', !st.panels);
    }
  });

  /* play */
  function stopPlay() {
    st.playing = false;
    if (st.timer) { clearTimeout(st.timer); st.timer = null; }
    var b = $('#play-btn'); if (b) b.textContent = '▶ Play 1853 → 1871';
  }
  function startPlay() {
    st.playing = true;
    var b = $('#play-btn'); if (b) b.textContent = '❚❚ Pause';
    resetView();
    setYear(Y0);
    var idx = 0;
    var step = function () {
      if (!st.playing) return;
      idx++;
      if (idx >= ERAS.length) { stopPlay(); return; }
      setYear(ERAS[idx]);
      st.timer = setTimeout(step, 1500);
    };
    st.timer = setTimeout(step, 700);
  }
  $('#play-btn').addEventListener('click', function () { if (st.playing) stopPlay(); else startPlay(); });

  /* toast + help */
  var toastEl = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:absolute;left:50%;bottom:18px;transform:translateX(-50%);' +
        'background:rgba(30,25,19,.92);color:#f6efe0;padding:8px 14px;border-radius:6px;font-size:13px;' +
        'pointer-events:none;z-index:60;transition:opacity .3s';
      $('#map-wrap').appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    setTimeout(function () { toastEl.style.opacity = '0'; }, 2200);
  }
  function showHelp() {
    var m = $('#modal'), card = $('#modal-card');
    card.innerHTML =
      '<h2 style="margin:0 0 4px">Europe, 1853–1871</h2>' +
      '<p class="brand-sub" style="margin:0 0 14px">歐洲協調制度的瓦解：從克里米亞戰爭到德意志統一</p>' +
      '<div class="info-notes" style="border-top:none;padding-top:0">' +
      '<p><b>操作</b>：拖曳平移、滾輪縮放、雙擊放大。滑桿或下方事件清單可切換年代。</p>' +
      '<p><b>疆界調整</b>：按工具列 <b>Edit borders</b>，點選一個國家即顯示邊界節點；拖曳節點即可同時帶動相鄰國家的共用邊界。Undo 可復原，Reset borders 還原歷史值。</p>' +
      '<p><b>鍵盤</b>：<span class="kbd">←</span><span class="kbd">→</span> 逐年、<span class="kbd">PgUp</span><span class="kbd">PgDn</span> 跳到關鍵年代、<span class="kbd">E</span> 編輯模式、<span class="kbd">L</span> 標籤、<span class="kbd">R</span> 重設視角、<span class="kbd">Esc</span> 取消選取。</p>' +
      '<p><b>輸出</b>：PNG 匯出當前地圖；Save 匯出目前疆界的經緯度 JSON（可再匯入）。</p>' +
      '<p><b>邊界精度</b>：國界為 1:10,000,000 級的歷史重建（權衡可讀性與精確度）。海岸線取自現代高解析資料，內陸邊界依 1815/1878 歷史圖層與現代行政區界推導；巴爾幹與高加索細節為近似值。</p>' +
      '<p><b>資料來源</b>：歷史疆域 <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a>（André Ourednik, CC BY-SA 4.0）；海岸線與行政區 <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>（public domain）。' +
      '歷史敘述為教學用途整理，採中性史學表述。</p>' +
      '</div>' +
      '<div style="text-align:right;margin-top:14px"><button class="btn" id="modal-close">關閉 Close</button></div>';
    m.hidden = false;
    $('#modal-close').addEventListener('click', function () { m.hidden = true; });
    m.addEventListener('click', function (e) { if (e.target === m) m.hidden = true; });
  }

  /* ---------------------------------------------------------------- export */
  function svgToBlobUrl(cb) {
    var clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', NS);
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    var stl = document.createElementNS(NS, 'style');
    stl.textContent = SVG_EXPORT_CSS;
    clone.insertBefore(stl, clone.firstChild);
    var s = new XMLSerializer().serializeToString(clone);
    var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>' + s], { type: 'image/svg+xml;charset=utf-8' });
    cb(URL.createObjectURL(blob));
  }
  function exportPNG() {
    gLabel.style.opacity = '1';
    layoutLabels();
    svgToBlobUrl(function (url) {
      var img = new Image();
      img.onload = function () {
        var scale = 2;
        var cv = document.createElement('canvas');
        cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#c9dbe5'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) { download(b, 'Europe_1853-1871_' + st.year + '.png'); });
      };
      img.onerror = function () { toast('PNG 匯出失敗，請改用瀏覽器列印為 PDF'); };
      img.src = url;
    });
  }
  function exportJSON() {
    var out = {
      title: 'Europe 1853-1871 border state',
      year: st.year,
      generated: new Date().toISOString(),
      note: 'coordinates are [lon,lat] rings per region id',
      regions: REG.map(function (r, i) { return { id: r.id, rings: st.rings[i] }; })
    };
    download(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }), 'europe_borders_' + st.year + '.json');
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  var SVG_EXPORT_CSS =
    '.sea{fill:#c9dbe5}.parchment{fill:#f7f0e2}' +
    '.region{stroke-linejoin:round}' +
    '.country-label text{text-anchor:middle;dominant-baseline:middle;font-family:"Segoe UI","Microsoft JhengHei",sans-serif}' +
    '.label-en{font-size:17px;font-weight:700;fill:#241f19;stroke:#f7f0e0;stroke-width:3px;paint-order:stroke;letter-spacing:.02em}' +
    '.label-zh{font-size:13px;font-weight:600;fill:#5a4a36;stroke:#f7f0e0;stroke-width:2.4px;paint-order:stroke}' +
    '.country-label.rank-1 .label-en{font-size:17px}.country-label.rank-2 .label-en{font-size:14px}.country-label.rank-3 .label-en{font-size:11.5px}' +
    '.country-label.rank-1 .label-zh{font-size:13.5px}.country-label.rank-2 .label-zh{font-size:11px}.country-label.rank-3 .label-zh{font-size:9.2px}' +
    '.sea-label{font-family:Georgia,serif;font-style:italic;font-size:12px;fill:#5e7b86;letter-spacing:.16em;text-anchor:middle}' +
    '.group-frame-label text{text-anchor:middle;font-family:"Segoe UI",sans-serif;font-weight:700;letter-spacing:.17em;fill:#1c3f63}' +
    '.city-dot{fill:#33291f;stroke:#f7f1e3;stroke-width:1.3}.city-label{font-family:"Segoe UI",sans-serif;font-size:10.5px;fill:#453a2c}' +
    '.battle-marker{fill:#8c2f23;stroke:#f8f2e4;stroke-width:1.4}' +
    '.battle-label{font-family:Georgia,serif;font-style:italic;font-size:10.5px;fill:#7a2519}' +
    '#edit-layer{display:none}';

  /* ---------------------------------------------------------------- keyboard */
  window.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.key === 'ArrowRight') { stopPlay(); setYear(st.year + 1); }
    else if (e.key === 'ArrowLeft') { stopPlay(); setYear(st.year - 1); }
    else if (e.key === 'PageUp') { stopPlay(); setYear(ERAS[clamp(st.era + 1, 0, ERAS.length - 1)]); }
    else if (e.key === 'PageDown') { stopPlay(); setYear(ERAS[clamp(st.era - 1, 0, ERAS.length - 1)]); }
    else if (e.key === 'Escape') { selectEntity(null); $('#modal').hidden = true; }
    else if (e.key === 'e' || e.key === 'E') toggleEdit();
    else if (e.key === 'l' || e.key === 'L') { st.labels = !st.labels; setActive('toggle-labels', st.labels); layoutLabels(); }
    else if (e.key === 'r' || e.key === 'R') resetView();
    else if (e.key === '+' || e.key === '=') doZoom(1.3);
    else if (e.key === '-' || e.key === '_') doZoom(1 / 1.3);
    else if (e.key === ' ') { e.preventDefault(); if (st.playing) stopPlay(); else startPlay(); }
  });

  /* ---------------------------------------------------------------- responsive */
  function applyResponsive() {
    var w = window.innerWidth;
    if (w < 1100) $('#panel-right').classList.add('is-collapsed');
    else if (st.panels) $('#panel-right').classList.remove('is-collapsed');
    if (w < 900) $('#panel-left').classList.add('is-collapsed');
    else if (st.panels) $('#panel-left').classList.remove('is-collapsed');
  }
  window.addEventListener('resize', function () { applyResponsive(); });

  /* ---------------------------------------------------------------- self test
   * open with #selftest=1 to run data/geometry assertions and print the report
   * into the status bar + console (used for headless QA). */
  function selfTest() {
    var out = [], fails = 0;
    function ok(name, cond, extra) {
      out.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? ' (' + extra + ')' : ''));
      if (!cond) fails++;
    }
    /* 1. projection round-trip */
    var worst = 0;
    [[-9, 38], [2, 48], [15, 50], [30, 60], [44, 42], [7, 63]].forEach(function (p) {
      var s = toSvg(p[0], p[1]), ll = toLonLat(s[0], s[1]);
      worst = Math.max(worst, Math.abs(ll[0] - p[0]), Math.abs(ll[1] - p[1]));
    });
    ok('projection round-trip', worst < 1e-6, 'err=' + worst.toExponential(2));
    /* 2. historical ownership assertions */
    var facts = [
      [1853, 'venetia', 'austria'], [1853, 'lombardy', 'austria'],
      [1853, 'alsace_lorraine', 'france'], [1853, 'savoy_nice', 'sardinia'],
      [1853, 'south_bessarabia', 'russia'], [1853, 'hanover', 'hanover'],
      [1856, 'south_bessarabia', 'romania'], [1859, 'lombardy', 'sardinia'],
      [1859, 'venetia', 'austria'], [1860, 'savoy_nice', 'france'],
      [1860, 'tuscany', 'sardinia'], [1861, 'sardinia', 'italy'],
      [1864, 'schleswig', 'prussia'], [1864, 'holstein', 'austria'],
      [1866, 'venetia', 'italy'], [1866, 'hanover', 'prussia'],
      [1866, 'mantua', 'italy'], [1867, 'austria', 'austria_hungary'],
      [1870, 'papal_lazio', 'italy'], [1871, 'alsace_lorraine', 'germany'],
      [1871, 'bavaria', 'bavaria']
    ];
    var byId = {};
    REG.forEach(function (r, i) { byId[r.id] = i; });
    var badFacts = [];
    facts.forEach(function (f) {
      var i = byId[f[1]];
      if (i === undefined) { badFacts.push(f[1] + '?'); return; }
      if (REG[i].o[eraOf(f[0])] !== ENT_INDEX[f[2]]) badFacts.push(f[1] + '@' + f[0]);
    });
    ok('historical ownership', badFacts.length === 0, badFacts.join(','));
    /* 3. group membership */
    ok('ngc frame 1867', REG[byId['hanover']].g[eraOf(1867)] === GROUP_IDS.indexOf('ngc'));
    ok('germany frame 1871', REG[byId['bavaria']].g[eraOf(1871)] === GROUP_IDS.indexOf('germany'));
    /* 4. render every era */
    var err = null, labelCounts = [];
    try {
      ERAS.forEach(function (y) { st.year = y; st.era = eraOf(y); render(); labelCounts.push(gLabel.childNodes.length); });
    } catch (e) { err = e.message; }
    ok('render all eras', !err, err || '');
    ok('labels >=3 in every era', labelCounts.every(function (n) { return n >= 3; }), labelCounts.join('/'));
    /* 5. border edit mutation */
    try {
      var ri = byId['bavaria'];
      var before = pathOf(ri);
      st.rings[ri][0][0][0] += 0.05;
      refreshRegion(ri);
      regionEls[ri].setAttribute('d', pathOf(ri));
      ok('edit changes geometry', pathOf(ri) !== before);
      st.rings = cloneRings(); refreshRegion(ri); regionEls[ri].setAttribute('d', pathOf(ri));
      ok('reset restores geometry', pathOf(ri) === before);
    } catch (e2) { ok('edit changes geometry', false, e2.message); }
    /* 6. serialisation */
    try { ok('json exportable', JSON.stringify(st.rings).length > 1000); }
    catch (e3) { ok('json exportable', false, e3.message); }
    /* 7. data integrity */
    ok('regions have rings', REG.every(function (r) { return r.rings.length > 0; }));
    ok('entities have colours', D.entities.every(function (e) { return e.id === 'ngc' || (e.color && /^#/.test(e.color)); }));
    ok('events present', D.events.length >= 20, D.events.length + '');
    /* restore 1853 */
    st.year = Y0; st.era = 0; st.selected = null; render();
    var report = (fails ? 'SELFTEST FAIL ' + fails : 'SELFTEST PASS ' + out.length) + ' :: ' + out.join(' | ');
    var el = document.createElement('div');
    el.id = 'selftest-result';
    el.textContent = report;
    el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;font-size:9px;max-width:100%;background:#fff';
    document.body.appendChild(el);
    console.log(report);
  }

  /* ---------------------------------------------------------------- init */
  /* deep links: #y=1871  #sel=prussia  #edit=1 */
  (function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    var q = {};
    h.split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p.length === 2) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1]);
    });
    if (q.y) { st.year = clamp(+q.y || Y0, Y0, Y1); st.era = eraOf(st.year); }
    if (q.sel && ENT[q.sel]) st.selected = q.sel;
    if (q.edit === '1') { st.edit = true; svg.classList.add('is-editing'); setActive('toggle-edit', true); }
    if (q.labels === '0') { st.labels = false; setActive('toggle-labels', false); }
    if (q.k) {
      st.k = clamp(+q.k || 1, 0.9, 14);
      var c = toSvg(+q.clon || 12, +q.clat || 48);
      st.tx = W / 2 - st.k * c[0];
      st.ty = H / 2 - st.k * c[1];
    }
  })();

  buildTimeline();
  buildEvents();
  applyResponsive();
  applyTransform();
  setActive('toggle-labels', st.labels);
  setActive('toggle-borders', true);
  render();
  if (st.edit && st.selected) selectEntity(st.selected);
  if ((location.hash || '').indexOf('selftest=1') >= 0) setTimeout(selfTest, 60);
  var hint = $('#map-hint');
  if (hint) {
    setTimeout(function () { hint.style.transition = 'opacity .8s'; }, 60);
    setTimeout(function () { hint.style.opacity = '0'; }, 7000);
  }
})();

</script>
