<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Europe 1853–1871 · 歐洲協調制度的瓦解（互動歷史地圖）</title>
<style>
/* ==========================================================================
   Europe, 1853–1871 · 互動歷史地圖 — src/ui.css
   風格：學術歷史地圖集（historical atlas）
         羊皮紙／米色地圖底、墨線邊界、襯線標題、暖灰面板 + 深墨藍頂欄
         重點色：暗紅 #8c2f23、普魯士藍 #1c3f63
   單檔離線：本檔不使用任何網路字型、外部圖片或 CDN；字型一律系統堆疊。
   依 CONTRACT.md 第 1–3 節撰寫（DOM 骨架固定，勿改 class 名）。

   ── 給 Lead 接 JS 的接口 ────────────────────────────────────────────────
   1. #year-slider 的填色進度靠 CSS 變數 --range-p（百分比字串）驅動，
      年份變更時執行：slider.style.setProperty('--range-p', pct + '%')。
      未設定時軌道呈整條未填色，不會壞版。
   2. 窄螢幕（<1180px）右欄、(<900px) 左欄變成覆蓋式抽屜，
      加上 .is-collapsed = 收起；請在載入與 resize 時依 innerWidth 切換。
   3. .region / .legend-swatch / 城市點的半徑等「資料性」外觀由 inline 屬性
      或 JS 給值；本檔只用低強度預設值，未使用 !important 硬改 fill。
   4. .country-label 的字級靠外層 --label-size 變數分級（rank-1/2/3）。
   ========================================================================== */

/* ==========================================================================
   0. 設計變數（palette / metrics / type）
   ========================================================================== */
:root {
  /* ── 色票 ───────────────────────────────────────────────── */
  --ink: #241f19;          /* 主墨色（地圖國名、面板標題） */
  --ink-2: #3d3327;        /* 內文墨色 */
  --ink-3: #5c4e3e;        /* 次要內文 */
  --paper: #f3ead7;        /* 羊皮紙底 */
  --paper-2: #e9dec6;      /* 紙色陰影 */
  --paper-3: #dccfb2;      /* 紙色深階（分隔線、軌道） */
  --land: #e8dcc0;         /* 陸地預設 */
  --sea: #d6e2e1;          /* 海域（灰藍綠） */
  --sea-2: #c2d2d3;
  --accent: #8c2f23;       /* 暗紅：選取、重點、戰役 */
  --accent-soft: #ae5442;
  --accent-tint: rgba(140, 47, 35, 0.10);
  --accent-2: #1c3f63;     /* 普魯士藍：toggle、邦聯框線 */
  --accent-2-soft: #2f5c88;
  --accent-2-tint: rgba(28, 63, 99, 0.10);
  --panel-bg: #efe8da;     /* 面板暖灰 */
  --panel-bg-2: #e7decb;
  --panel-bd: rgba(112, 92, 64, 0.28);
  --panel-bd-soft: rgba(112, 92, 64, 0.15);
  --header-bg: #1b2733;    /* 深墨藍頂欄 */
  --header-bg-2: #131c25;
  --header-ink: #f5eedf;
  --header-muted: #a9b4c0;
  --muted: #8b7a62;        /* 說明文字 */
  --line: rgba(112, 92, 64, 0.30);
  --line-strong: rgba(90, 74, 56, 0.48);

  /* ── 尺寸 ───────────────────────────────────────────────── */
  --sidebar-w: 300px;
  --right-w: 320px;
  --topbar-h: 64px;
  --statusbar-h: 28px;
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;

  /* ── 字型堆疊（含繁中系統字） ───────────────────────────── */
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
    Georgia, "Times New Roman", "Songti TC", "Noto Serif TC", "Source Han Serif TC",
    "PMingLiU", "Microsoft JhengHei", serif;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
    "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Hiragino Sans TC",
    "Source Han Sans TC", "Meiryo", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular",
    "Courier New", monospace;
  --fs-base: 15px;
}

/* 投影機 / 大螢幕：面板與字級同步放大 */
@media (min-width: 1660px) {
  :root {
    --sidebar-w: 326px;
    --right-w: 348px;
    --fs-base: 15.5px;
    --topbar-h: 68px;
  }
}
@media (min-width: 1920px) {
  :root {
    --sidebar-w: 344px;
    --right-w: 366px;
    --fs-base: 16px;
  }
}

/* ==========================================================================
   1. 基礎重置
   ========================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  height: 100%;
  overflow: hidden; /* 整頁永不出現滾動，只有面板內部可捲 */
  background: #10171e;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

[hidden] {
  display: none !important;
}

h1, h2, h3, h4, p, ol, ul, figure {
  margin: 0;
}

button,
input {
  font: inherit;
  color: inherit;
}

img, svg {
  max-width: 100%;
}

::selection {
  background: rgba(140, 47, 35, 0.22);
}

/* 細捲軸（面板內） */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(120, 100, 70, 0.32);
  border: 2px solid transparent;
  border-radius: 999px;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(90, 74, 56, 0.52);
  background-clip: padding-box;
}

/* ==========================================================================
   2. App 骨架：三列 grid（不可整頁滾動）
   ========================================================================== */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  overflow: hidden;
  background: var(--header-bg);
}

.main {
  position: relative;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--right-w);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

/* ==========================================================================
   3. 頂欄 #topbar / 品牌 / 工具列
   ========================================================================== */
#topbar {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 18px;
  min-height: var(--topbar-h);
  padding: 9px 16px;
  color: var(--header-ink);
  background: linear-gradient(180deg, #1e2b39 0%, var(--header-bg) 55%, var(--header-bg-2) 100%);
  border-bottom: 1px solid #0b1117;
  box-shadow:
    inset 0 -2px 0 rgba(140, 47, 35, 0.7),
    0 2px 12px rgba(0, 0, 0, 0.28);
}

.brand {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  flex: 0 1 auto;
  min-width: 0;
  padding-left: 13px;
  border-left: 3px solid var(--accent);
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.12;
  letter-spacing: 0.015em;
  color: var(--header-ink);
  white-space: nowrap;
}

.brand-sub {
  font-size: 12px;
  line-height: 1.32;
  letter-spacing: 0.015em;
  color: var(--header-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 48ch;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
  margin-left: auto;
}

/* ── 按鈕 ─────────────────────────────────────────────────── */
.btn {
  -webkit-appearance: none;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 10px;
  border: 1px solid rgba(60, 46, 30, 0.42);
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, #fbf6e9 0%, #efe6d2 100%);
  color: #3b3229;
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.72),
    0 1px 2px rgba(20, 14, 8, 0.22);
  transition: background-color 0.14s ease, border-color 0.14s ease,
    color 0.14s ease, box-shadow 0.14s ease, transform 0.06s ease;
}

.btn:hover {
  background: linear-gradient(180deg, #fffaee 0%, #f4ebd6 100%);
  border-color: rgba(140, 47, 35, 0.55);
  color: #2a221a;
}

.btn:active {
  transform: translateY(1px);
  background: linear-gradient(180deg, #e7dcc4 0%, #f2e8d3 100%);
  box-shadow: inset 0 1px 3px rgba(60, 45, 30, 0.28);
}

.btn:focus-visible {
  outline: 2px solid #6fa3d2;
  outline-offset: 2px;
}

.btn:disabled,
.btn[disabled],
.btn[aria-disabled="true"] {
  opacity: 0.42;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.btn.is-active {
  background: linear-gradient(180deg, #24507c 0%, var(--accent-2) 100%);
  border-color: #102c46;
  color: #f6f0e2;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -2px 6px rgba(0, 0, 0, 0.22),
    0 1px 2px rgba(10, 18, 28, 0.3);
}

/* toggle 按鈕左側小指示燈 */
.btn.toggle::before {
  content: "";
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.34;
  transition: opacity 0.14s ease, background-color 0.14s ease,
    box-shadow 0.14s ease;
}

.btn.toggle.is-active {
  background: linear-gradient(180deg, #24507c 0%, var(--accent-2) 100%);
  border-color: #0f2b44;
  color: #f7f1e3;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.2),
    0 0 0 1px rgba(28, 63, 99, 0.45),
    0 1px 2px rgba(10, 18, 28, 0.32);
}

.btn.toggle.is-active::before {
  opacity: 1;
  background: #f3c9a2;
  box-shadow: 0 0 5px rgba(243, 201, 162, 0.9);
}

/* 暗紅重點按鈕（Edit borders） */
.btn.accent {
  border-color: rgba(140, 47, 35, 0.5);
  color: var(--accent);
  background: linear-gradient(180deg, #fdf7ea 0%, #f1e6d1 100%);
}

.btn.accent:hover {
  border-color: var(--accent);
  color: #71251b;
}

.btn.accent.is-active {
  background: linear-gradient(180deg, #a03c2d 0%, var(--accent) 70%, #74241a 100%);
  border-color: #6a2118;
  color: #fdf7e8;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.24),
    0 0 0 1px rgba(140, 47, 35, 0.45),
    0 2px 6px rgba(60, 16, 10, 0.34);
}

.btn.wide {
  display: flex;
  width: 100%;
  justify-content: center;
  padding: 9px 12px;
  font-size: 13px;
  letter-spacing: 0.02em;
  margin-top: 2px;
}

/* 縮放鈕：方形、字級稍大 */
.btn[data-action="zoom-in"],
.btn[data-action="zoom-out"] {
  min-width: 32px;
  padding: 6px 9px;
  font-size: 15px;
  font-weight: 500;
}

.btn[data-action="help"] {
  min-width: 30px;
  padding: 6px 8px;
  font-size: 13.5px;
}

/* ==========================================================================
   4. 面板（左：時間軸＋事件／右：資訊＋圖例）
   ========================================================================== */
.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  background: linear-gradient(180deg, var(--panel-bg) 0%, var(--panel-bg-2) 100%);
  color: var(--ink-2);
}

#panel-left {
  border-right: 1px solid var(--panel-bd);
  box-shadow: inset -8px 0 14px -12px rgba(60, 45, 30, 0.55);
}

#panel-right {
  border-left: 1px solid var(--panel-bd);
  box-shadow: inset 8px 0 14px -12px rgba(60, 45, 30, 0.55);
}

.panel-block {
  flex: 0 0 auto;
  padding: 14px 15px 16px;
  border-bottom: 1px solid var(--panel-bd-soft);
  min-width: 0;
}

.panel-block:last-child {
  border-bottom: none;
}

.block-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 11px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--panel-bd-soft);
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.11em;
  line-height: 1.25;
  text-transform: uppercase;
  color: #6b5a45;
}

.block-title::before {
  content: "";
  flex: 0 0 auto;
  width: 3px;
  height: 13px;
  border-radius: 1px;
  background: var(--accent);
}

/* ==========================================================================
   5. 時間軸：#timeline / 年份顯示 / 滑桿 / 刻度
   ========================================================================== */
#timeline {
  padding: 14px 15px 13px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 72%);
}

.year-readout {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
  margin-bottom: 9px;
}

#year-value {
  flex: 0 0 auto;
  font-family: var(--font-serif);
  font-size: 31px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
}

.year-era {
  flex: 1 1 auto;
  min-width: 0;
  text-align: right;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12px;
  line-height: 1.3;
  color: var(--ink-3);
  letter-spacing: 0.01em;
}

/* ── 自訂 range 滑桿（webkit + moz） ──────────────────────── */
#year-slider {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 22px;
  margin: 2px 0 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  /* 填色進度：JS 設定 --range-p */
  --range-p: 0%;
}

#year-slider:focus {
  outline: none;
}

#year-slider::-webkit-slider-runnable-track {
  width: 100%;
  height: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background:
    linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) var(--range-p, 0%),
      #cdbfa4 var(--range-p, 0%),
      #cdbfa4 100%
    );
  box-shadow:
    inset 0 1px 2px rgba(60, 45, 30, 0.3),
    inset 0 -1px 0 rgba(255, 255, 255, 0.35);
}

#year-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -7px;
  border: 2px solid #fbf5e7;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #c05a45 0%, var(--accent) 58%, #6c231a 100%);
  box-shadow:
    0 1px 3px rgba(40, 25, 15, 0.5),
    0 0 0 1px rgba(90, 30, 22, 0.4);
  cursor: grab;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

#year-slider:hover::-webkit-slider-thumb {
  transform: scale(1.06);
  box-shadow:
    0 1px 4px rgba(40, 25, 15, 0.55),
    0 0 0 1px rgba(90, 30, 22, 0.45),
    0 0 0 5px rgba(140, 47, 35, 0.1);
}

#year-slider:active::-webkit-slider-thumb {
  cursor: grabbing;
  transform: scale(1.12);
}

#year-slider:focus-visible::-webkit-slider-thumb {
  box-shadow:
    0 0 0 3px #fbf5e7,
    0 0 0 6px rgba(28, 63, 99, 0.45),
    0 1px 3px rgba(40, 25, 15, 0.5);
}

/* Firefox */
#year-slider::-moz-range-track {
  width: 100%;
  height: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: #cdbfa4;
  box-shadow: inset 0 1px 2px rgba(60, 45, 30, 0.3);
}

#year-slider::-moz-range-progress {
  height: 8px;
  border-radius: 999px;
  background: var(--accent);
}

#year-slider::-moz-range-thumb {
  width: 17px;
  height: 17px;
  border: 2px solid #fbf5e7;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #c05a45 0%, var(--accent) 58%, #6c231a 100%);
  box-shadow:
    0 1px 3px rgba(40, 25, 15, 0.5),
    0 0 0 1px rgba(90, 30, 22, 0.4);
  cursor: grab;
}

#year-slider:focus-visible::-moz-range-thumb {
  box-shadow:
    0 0 0 3px #fbf5e7,
    0 0 0 6px rgba(28, 63, 99, 0.45);
}

/* ── 事件刻度（由 JS 產生 .tick，left 用百分比定位） ──────── */
.era-ticks {
  position: relative;
  height: 25px;
  margin: 6px 2px 10px;
  min-width: 0;
}

.tick {
  position: absolute;
  top: 0;
  width: 2px;
  height: 9px;
  margin-left: -1px;
  border-radius: 1px;
  background: rgba(112, 92, 64, 0.42);
  cursor: pointer;
  transition: height 0.12s ease, background-color 0.12s ease,
    box-shadow 0.12s ease;
}

.tick::after {
  content: "";
  position: absolute;
  top: -1px;
  left: -1px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: inherit;
  opacity: 0.9;
}

.tick:hover {
  height: 13px;
  background: var(--accent-soft);
}

.tick.is-active {
  height: 15px;
  background: var(--accent);
  box-shadow: 0 0 0 2px rgba(140, 47, 35, 0.16);
}

.tick.is-active::after {
  background: var(--accent);
}

.tick:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
}

/* 若 JS 在 .tick 內放入年份字樣 */
.tick > span,
.tick .tick-year {
  position: absolute;
  top: 13px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.tick.is-active > span,
.tick.is-active .tick-year {
  color: var(--accent);
  font-weight: 700;
}

/* ==========================================================================
   6. 事件清單（垂直時間軸）
   ========================================================================== */
#event-block {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  padding: 14px 8px 0 15px;
  border-bottom: none;
  overflow: hidden;
}

#event-block > .block-title {
  flex: 0 0 auto;
  margin-right: 7px;
}

.event-list {
  list-style: none;
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
  padding: 2px 7px 16px 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-gutter: stable;
}

/* 每一筆事件：左側圓點 + 連接線 */
.event-item {
  position: relative;
  margin-left: 18px;
  padding: 8px 9px 9px 12px;
  border-left: 2px solid rgba(140, 120, 88, 0.42);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  cursor: pointer;
  transition: background-color 0.14s ease, border-color 0.14s ease,
    box-shadow 0.14s ease;
}

.event-item + .event-item {
  margin-top: 1px;
}

.event-item:hover {
  background: rgba(255, 255, 255, 0.42);
  border-left-color: var(--accent-soft);
}

.event-item:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: -1px;
}

/* 圓點（JS 產生 span.ev-dot；絕對定位在左側線中央） */
.ev-dot {
  position: absolute;
  top: 12px;
  left: -7px;
  width: 11px;
  height: 11px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  background: #f7f1e3;
  box-shadow: 0 0 0 2px var(--panel-bg);
  transition: background-color 0.14s ease, border-color 0.14s ease,
    box-shadow 0.14s ease, transform 0.14s ease;
}

.event-item:hover .ev-dot {
  border-color: var(--accent-soft);
  transform: scale(1.08);
}

.ev-year {
  display: block;
  margin-bottom: 2px;
  font-family: var(--font-serif);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ev-title {
  display: block;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  color: #2c251d;
  letter-spacing: 0.005em;
}

.ev-title-en {
  display: block;
  margin-top: 2px;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12.5px;
  line-height: 1.34;
  color: var(--muted);
}

/* 選中事件：暗紅左框 + 淡紅底 + 實心圓點 */
.event-item.is-active {
  border-left-color: var(--accent);
  background: linear-gradient(
    90deg,
    rgba(140, 47, 35, 0.13) 0%,
    rgba(140, 47, 35, 0.045) 62%,
    rgba(140, 47, 35, 0.01) 100%
  );
  box-shadow: inset 3px 0 0 -1px rgba(140, 47, 35, 0.35);
}

.event-item.is-active .ev-dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--panel-bg), 0 0 0 4px rgba(140, 47, 35, 0.18);
}

.event-item.is-active .ev-title {
  color: #6d2419;
}

.event-item.is-active .ev-year {
  color: #74251b;
}

.event-item.is-active .ev-title-en {
  color: #8a5a48;
}

/* ==========================================================================
   7. 地圖區 #map-wrap
   ========================================================================== */
#map-wrap {
  position: relative;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  height: 100%;
  isolation: isolate;
  background-color: var(--paper);
  background-image:
    radial-gradient(115% 85% at 50% 6%, #fbf5e7 0%, #f0e6d0 56%, #e3d6ba 100%);
  border-left: 1px solid var(--panel-bd);
  border-right: 1px solid var(--panel-bd);
}

/* 紙紋 + 邊角暈影（純 CSS，不使用外部圖片） */
#map-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    repeating-linear-gradient(0deg, rgba(120, 96, 64, 0.03) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120, 96, 64, 0.022) 0 1px, transparent 1px 4px),
    radial-gradient(130% 100% at 50% 0%, rgba(255, 251, 240, 0.55) 0%, rgba(255, 251, 240, 0) 62%);
}

#map-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  box-shadow:
    inset 0 0 54px rgba(92, 74, 50, 0.18),
    inset 0 0 3px rgba(92, 74, 50, 0.28);
}

.map,
#map {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  font-family: var(--font-sans);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.map:active,
#map:active {
  cursor: grabbing;
}

.map.is-panning,
.map.is-dragging {
  cursor: grabbing;
}

/* 地圖提示與比例尺 */
.map-hint {
  position: absolute;
  left: 13px;
  bottom: 12px;
  z-index: 4;
  padding: 4px 10px;
  border: 1px solid var(--panel-bd);
  border-radius: 999px;
  background: rgba(247, 241, 229, 0.86);
  color: #6b5a45;
  font-size: 11.5px;
  line-height: 1.45;
  letter-spacing: 0.01em;
  pointer-events: none;
  box-shadow: 0 1px 3px rgba(60, 45, 30, 0.12);
}

.map-scale {
  position: absolute;
  right: 13px;
  bottom: 12px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 8px;
  border: 1px solid var(--panel-bd);
  border-radius: var(--r-sm);
  background: rgba(247, 241, 229, 0.86);
  color: #5c4a36;
  font-size: 10.5px;
  line-height: 1.4;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  box-shadow: 0 1px 3px rgba(60, 45, 30, 0.12);
}

.map-scale > i,
.map-scale .scale-bar {
  display: block;
  width: 54px;
  height: 6px;
  border: 1px solid #6b5a45;
  border-top: none;
  background: linear-gradient(90deg, #6b5a45 0 50%, transparent 50% 100%);
}

/* Tooltip（游標跟隨；JS 設定 left / top） */
.tooltip {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 30;
  max-width: 260px;
  padding: 6px 10px 7px;
  border: 1px solid rgba(0, 0, 0, 0.4);
  border-radius: var(--r-sm);
  background: rgba(30, 25, 19, 0.94);
  color: #f6efe0;
  font-size: 12.5px;
  line-height: 1.42;
  letter-spacing: 0.01em;
  text-align: center;
  pointer-events: none;
  transform: translate(-50%, -128%);
  box-shadow: 0 6px 18px rgba(30, 20, 10, 0.4);
}

.tooltip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  width: 0;
  height: 0;
  margin-left: -5px;
  border: 5px solid transparent;
  border-top-color: rgba(30, 25, 19, 0.94);
}

.tooltip b,
.tooltip strong {
  display: block;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* ==========================================================================
   8. SVG 地圖外觀（資料由 Lead 注入；fill 多由 inline 屬性覆寫）
   ========================================================================== */
.parchment {
  fill: var(--paper);
}

.sea {
  fill: var(--sea);
  stroke: none;
}

.graticule {
  fill: none;
  stroke: rgba(96, 112, 116, 0.28);
  stroke-width: 0.6;
  stroke-dasharray: 3 4;
  pointer-events: none;
  vector-effect: non-scaling-stroke;
}

.graticule-label {
  fill: #9d8e78;
  font-size: 9.5px;
  font-family: var(--font-sans);
  letter-spacing: 0.08em;
  pointer-events: none;
  user-select: none;
}

/* 國界與行政線
   同上：stroke 顏色由 Lead 以 inline 值注入（各年份邊界粗細/顏色可能不同），
   本檔只鎖定「無填色 + 線端樣式 + 不吃滑鼠事件」，不宣告 stroke 顏色。 */
.internal-border {
  fill: none;
  stroke-width: 0.7;
  stroke-dasharray: 2.5 2;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}

.entity-border {
  fill: none;
  stroke-width: 1.15;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}

/* 邦聯框線（德意志邦聯 / 義大利諸邦）：虛線框，不填色 */
.group-frame {
  fill: none;
  stroke-width: 1.15;
  stroke-dasharray: 7 5;
  stroke-linejoin: round;
  pointer-events: none;
}

.group-frame-label {
  fill: var(--accent-2);
  stroke: #f6efdf;
  stroke-width: 2.6px;
  paint-order: stroke;
  stroke-linejoin: round;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
}

/* 國土
   注意：實體填色由 Lead 以 inline fill 屬性注入（presentation attribute 會被
   任何 CSS 宣告覆蓋），所以本檔對 .region **完全不宣告 fill / stroke 顏色**，
   只負責互動外觀（游標、過場、hover / selected 的濾鏡）。
   邊界線由 .entity-border / .internal-border 圖層負責（同為 inline 值）。 */
.region {
  stroke-linejoin: round;
  cursor: pointer;
  transition: filter 0.15s ease;
}

.region.is-hover {
  filter: brightness(1.07) saturate(1.06)
    drop-shadow(0 0 2px rgba(90, 50, 30, 0.5));
}

.region.is-selected {
  filter: brightness(1.04) saturate(1.16);
  cursor: pointer;
}

/* 邦聯成員：虛線提示（顏色沿用 Lead 注入的 stroke） */
.region.is-member {
  stroke-dasharray: 5 3;
  stroke-width: 1.5;
}

/* 選取外框（獨立圖層，inline fill 不會蓋掉） */
.region-stroke {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
  vector-effect: non-scaling-stroke;
}

/* 國名標籤：白／紙色光暈（paint-order） */
.country-label {
  --label-size: 13px;
  --label-weight: 700;
  pointer-events: none;
  user-select: none;
  text-anchor: middle;
  dominant-baseline: middle;
}

.label-en {
  font-family: var(--font-sans);
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  fill: var(--ink);
  stroke: #f7f0e0;
  stroke-width: 3px;
  paint-order: stroke;
  stroke-linejoin: round;
  letter-spacing: 0.02em;
  text-anchor: middle;
  dominant-baseline: middle;
}

.label-zh {
  font-family: var(--font-sans);
  font-size: max(calc(var(--label-size) * 0.8), 10px);
  font-weight: 600;
  fill: #5a4a36;
  stroke: #f7f0e0;
  stroke-width: 2.4px;
  paint-order: stroke;
  stroke-linejoin: round;
  letter-spacing: 0.04em;
  text-anchor: middle;
  dominant-baseline: middle;
}

.country-label.rank-1 {
  --label-size: 17px;
  --label-weight: 700;
}

.country-label.rank-2 {
  --label-size: 14px;
  --label-weight: 700;
}

.country-label.rank-3 {
  --label-size: 11.5px;
  --label-weight: 600;
}

.country-label.rank-1 .label-zh {
  fill: #4a3b2a;
  stroke-width: 3px;
}

.country-label.rank-3 .label-zh {
  stroke-width: 2px;
}

/* 海域名 */
.sea-label {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12px;
  font-weight: 500;
  fill: #5e7b86;
  stroke: rgba(246, 240, 228, 0.85);
  stroke-width: 2.6px;
  paint-order: stroke;
  stroke-linejoin: round;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.9;
  text-anchor: middle;
  pointer-events: none;
  user-select: none;
}

/* 城市與戰役 */
.city-dot {
  fill: #33291f;
  stroke: #f7f1e3;
  stroke-width: 1.3;
  pointer-events: none;
}

.city-label {
  font-family: var(--font-sans);
  font-size: 10.5px;
  font-weight: 500;
  fill: #453a2c;
  stroke: #f7f1e3;
  stroke-width: 2.4px;
  paint-order: stroke;
  stroke-linejoin: round;
  letter-spacing: 0.01em;
  pointer-events: none;
  user-select: none;
}

.battle-marker {
  fill: var(--accent);
  stroke: #f8f2e4;
  stroke-width: 1.4;
  pointer-events: none;
}

.battle-label {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 10.5px;
  font-weight: 600;
  fill: #7a2519;
  stroke: #f8f2e4;
  stroke-width: 2.4px;
  paint-order: stroke;
  stroke-linejoin: round;
  pointer-events: none;
  user-select: none;
}

/* ── 邊界拖曳節點 ────────────────────────────────────────── */
.vertex {
  fill: #fbf6ea;
  stroke: var(--accent);
  stroke-width: 1.7;
  cursor: grab;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.12s ease, fill 0.12s ease, stroke-width 0.12s ease,
    stroke 0.12s ease;
}

.vertex:hover {
  fill: #ffffff;
  transform: scale(1.35);
  stroke-width: 2;
  filter: drop-shadow(0 0 2px rgba(140, 47, 35, 0.55));
}

.vertex:active {
  cursor: grabbing;
  transform: scale(1.45);
}

.vertex:focus-visible {
  outline: none;
  stroke: var(--accent-2);
  stroke-width: 2.6;
  transform: scale(1.5);
}

/* 共用節點（兩國交界）：普魯士藍虛線圈 */
.vertex.is-shared {
  fill: #f7f1e3;
  stroke: var(--accent-2);
  stroke-width: 2.3;
  stroke-dasharray: 2.4 1.9;
}

.vertex.is-shared:hover,
.vertex.is-shared:focus-visible {
  stroke-width: 2.6;
  stroke-dasharray: none;
  fill: var(--accent-2);
}

/* 選取中 / 拖曳中的節點 */
.vertex.is-active,
.vertex.is-selected,
.vertex.is-dragging {
  fill: var(--accent);
  stroke: #fdf8ec;
  stroke-width: 2.4;
  transform: scale(1.5);
  filter: drop-shadow(0 0 3px rgba(140, 47, 35, 0.6));
}

/* 編輯模式（Lead 若在地圖上加 .is-editing 會有對應游標） */
.map.is-editing .region,
#map.is-editing .region {
  cursor: crosshair;
}

.map.is-editing .country-label,
#map.is-editing .country-label {
  opacity: 0.72;
}

/* ==========================================================================
   9. 右欄：資訊面板
   ========================================================================== */
#info {

}

.info-body {

/* 標籤徽章 / 條款 chip */

/* ==========================================================================
   10. 右欄：圖例
   ========================================================================== */

.legend-group-title {

}

/* ==========================================================================
   12. Modal（說明 / 鍵盤快捷）
   ========================================================================== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(18, 14, 10, 0.62);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}

.modal[hidden] {
  display: none;
}

.modal-card {
  position: relative;
  width: min(720px, 100%);
  max-height: 82vh;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 26px 30px 28px;
  border: 1px solid rgba(90, 74, 56, 0.5);
  border-radius: var(--r-lg);
  background:
    linear-gradient(180deg, #fbf5e6 0%, #f1e7d1 100%);
  color: var(--ink-2);
  box-shadow:
    0 24px 60px rgba(10, 7, 4, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  animation: modal-in 0.18s ease-out;
}

@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.modal-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: linear-gradient(90deg, var(--accent) 0%, #b0503f 42%, var(--accent-2) 100%);
}

.modal-card h2 {
  margin: 0 0 6px;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.modal-card h3 {
  margin: 20px 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--panel-bd-soft);
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: #6b5a45;
}

.modal-card p {
  margin: 8px 0;
  font-size: 14px;
  line-height: 1.75;
}

.modal-card ul,
.modal-card ol {
  margin: 8px 0;
  padding-left: 22px;
  font-size: 14px;
  line-height: 1.75;
}

.modal-card li {
  margin: 4px 0;
}

.modal-card li::marker {
  color: var(--accent);
}

.modal-card .modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
}

/* 鍵盤按鍵樣式 */
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 21px;
  padding: 0 6px;
  border: 1px solid rgba(90, 74, 56, 0.45);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: linear-gradient(180deg, #fffdf7 0%, #f0e8d6 100%);
  color: #3b3229;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  box-shadow: 0 1px 1px rgba(60, 45, 30, 0.18);
}

/* 說明表格 */
table.kv {
  width: 100%;
  margin: 10px 0 4px;
  border-collapse: collapse;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
}

table.kv th,
table.kv td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--panel-bd-soft);
  text-align: left;
  vertical-align: top;
}

table.kv th {
  width: 32%;
  color: #6f5f49;
  font-family: var(--font-sans);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}

table.kv tbody tr:nth-child(odd) {
  background: rgba(255, 255, 255, 0.34);
}

table.kv tbody tr:last-child th,
table.kv tbody tr:last-child td {
  border-bottom: none;
}

/* ==========================================================================
   13. 響應式：<1180px 右欄抽屜、<900px 左欄抽屜
   ========================================================================== */
@media (max-width: 1180px) {
  .main {
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  }

  #panel-right {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    width: min(348px, 88vw);
    border-left: 1px solid var(--panel-bd);
    background: linear-gradient(180deg, #f4eee1 0%, #e9e0cd 100%);
    box-shadow: -10px 0 26px rgba(40, 28, 16, 0.28);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    will-change: transform;
  }

  #panel-right.is-collapsed {
    transform: translateX(calc(100% + 26px));
    box-shadow: none;
    pointer-events: none;
  }

  /* 收合時右緣留一條細把手，提示可再展開 */
  #panel-right.is-collapsed::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 3px;
    height: 46px;
    margin-top: -23px;
    border-radius: 3px;
    background: rgba(140, 47, 35, 0.35);
  }
}

@media (max-width: 900px) {
  .main {
    grid-template-columns: minmax(0, 1fr);
  }

  #panel-left {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 21;
    width: min(320px, 86vw);
    border-right: 1px solid var(--panel-bd);
    background: linear-gradient(180deg, #f4eee1 0%, #e9e0cd 100%);
    box-shadow: 10px 0 26px rgba(40, 28, 16, 0.28);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    will-change: transform;
  }

  #panel-left.is-collapsed {
    transform: translateX(calc(-100% - 26px));
    box-shadow: none;
    pointer-events: none;
  }

  #panel-right {
    width: min(340px, 90vw);
  }

  .toolbar {
    gap: 5px;
  }

  .btn {
    padding: 6px 8px;
    font-size: 12px;
  }
}

@media (max-width: 760px) {
  #topbar {
    padding: 8px 10px;
    gap: 12px;
  }

  .brand-sub {
    display: none;
  }

  .brand-title {
    font-size: 18px;
  }

  #year-value {
    font-size: 26px;
  }

  .map-hint {
    display: none;
  }
}

/* 極矮視窗（例如 768px 高筆電 + 瀏覽器工具列）：壓縮時間軸區 */
@media (max-height: 760px) {
  #timeline {
    padding: 11px 15px 10px;
  }

  #year-value {
    font-size: 27px;
  }

  .era-ticks {
    height: 21px;
    margin-bottom: 7px;
  }

  .year-readout {
    margin-bottom: 6px;
  }

  .panel-block {
    padding: 12px 15px 13px;
  }
}

@media (max-height: 640px) {
  .era-ticks {
    display: none;
  }

  #year-value {
    font-size: 24px;
  }

  .brand-sub {
    display: none;
  }
}

/* ==========================================================================
   14. 無障礙 / 使用者偏好
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* 高對比模式：加深面板框線與標籤光暈
   （注意：不碰 .region / 邊界圖層的 stroke 顏色，那些由 Lead 的 inline 值決定） */
@media (prefers-contrast: more) {
  .panel {
    --panel-bd: rgba(70, 56, 38, 0.55);
    --panel-bd-soft: rgba(70, 56, 38, 0.32);
  }

  .label-en,
  .label-zh {
    stroke-width: 3.4px;
  }

  .region.is-hover {
    filter: brightness(1.12) saturate(1.1)
      drop-shadow(0 0 3px rgba(60, 40, 25, 0.7));
  }
}


/* Lead overrides — appended after ui.css at build time.
 * Kept separate so the designer's stylesheet stays untouched. */

/* 右欄：選取資訊不可被壓縮，超出時自己捲動；圖例保底高度 */
#info {
  flex: 0 0 auto;
  max-height: 58%;
}
#legend-block {
  min-height: 160px;
}

/* 頂欄副標：不要被省略號截斷得太早 */
.brand-sub {
  white-space: nowrap;
  max-width: 42vw;
}

/* 時間軸刻度：只留刻線與 hover 提示 */
.era-ticks .tick {
  min-width: 6px;
}

/* 地圖上的 SVG 文字一律不吃滑鼠，避免干擾拖拉與點選 */
#map text,
#map .country-label,
#map .sea-label {
  pointer-events: none;
}

/* 編輯模式：游標提示 */
#map.is-editing .region {
  cursor: crosshair;
}

/* 選取中的國家：淡淡外框，方便在編輯模式辨識 */
#map .region.is-selected {
  stroke-width: 1.6 !important;
}

/* 窄螢幕（筆電投影）縮小標籤字級，讓德意志諸邦不那麼擁擠 */
@media (max-width: 1500px) {
  .country-label.rank-1 {
    --label-size: 15.5px;
  }
  .country-label.rank-2 {
    --label-size: 12.5px;
  }
  .country-label.rank-3 {
    --label-size: 10.5px;
  }
  .label-zh {
    font-size: max(calc(var(--label-size) * 0.8), 9px);
  }
}

</style>

1856","titleEn":"The Crimean War","titleZh":"克里米亞戰爭","type":"war","summaryZh":"俄國以保護鄂圖曼東正教徒為名，1853 年佔領多瑙河公國；鄂圖曼宣戰，錫諾普海戰後英法參戰。聯軍登陸克里米亞、圍攻塞瓦斯托波爾。1856 年巴黎和約結束戰爭，俄國戰敗，黑海中立化。","detailZh":"克里米亞戰爭源於聖地保護權之爭，以及俄國要求對鄂圖曼境內東正教徒的保護權。1853 年緬什科夫使團施壓失敗，俄軍佔領摩爾達維亞與瓦拉幾亞；鄂圖曼在英法支持下宣戰。1853 年 11 月，納希莫夫率俄國黑海艦隊在錫諾普殲滅鄂圖曼分艦隊，英法遂於 1854 年 3 月對俄宣戰。奧地利雖未參戰，卻於 8 月進駐多瑙河公國，迫使俄軍撤退。戰事轉向克里米亞：聯軍登陸後在阿爾馬河取勝，開始圍攻塞瓦斯托波爾；巴拉克拉瓦與因克爾曼戰役暴露聯軍補給與指揮問題，南丁格爾的護理改革亦在此時展開。1855 年 9 月要塞陷落，俄國接受和談。此戰打破 1815 年以來大國以會議解決爭端的慣例，卻也讓協調制度在巴黎和會上曇花一現。","terms":["Menshikov mission","Battle of Sinope","Danubian Principalities","Eastern Question"],"eraLabel":"Crimean War begins"},{"id":"oltenitza_silistria","year":1854,"dateLabel":"1853–1855","titleEn":"The Danube Front and Sevastopol","titleZh":"多瑙河戰線與塞瓦斯托波爾圍城","type":"war","summaryZh":"俄軍與鄂圖曼在奧爾特尼察、錫利斯特拉一帶激戰，俄軍圍攻錫利斯特拉未克；1854 年英法參戰、奧地利進駐多瑙河公國，俄軍撤退。聯軍轉攻克里米亞，經阿爾馬河、巴拉克拉瓦、因克爾曼諸役，1855 年 9 月塞瓦斯托波爾陷落。","detailZh":"1853 年 11 月，鄂圖曼軍在奧爾特尼察渡河遭俄軍擊退；1854 年俄軍圍攻錫利斯特拉，久攻不下，加上奧地利 6 月與鄂圖曼簽約、8 月進駐公國，俄軍於 8 月撤出多瑙河兩公國。英法聯軍 3 月宣戰後登陸瓦爾納，9 月在克里米亞登陸，9 月 20 日阿爾馬河一戰擊敗緬什科夫；10 月 17 日起圍攻塞瓦斯托波爾。10 月 25 日巴拉克拉瓦之役中輕騎兵衝鋒（Charge of the Light Brigade）成為戰爭的象徵，11 月 5 日因克爾曼血戰後戰線僵持。1855 年聯軍攻佔馬梅隆與馬拉霍夫要塞，9 月 9 日塞瓦斯托波爾陷落，俄軍鑿沉艦隊撤退。此役顯示協調制度已無法約束大國，戰爭成為解決東方問題的手段。","terms":["Battle of Oltenița","Siege of Silistria","Battle of Balaklava","Siege of Sevastopol"],"eraLabel":"Sevastopol besieged"},{"id":"bessarabia_1856","year":1856,"dateLabel":"Mar 1856","titleEn":"Southern Bessarabia","titleZh":"南比薩拉比亞的割讓","type":"treaty","summaryZh":"巴黎條約將南比薩拉比亞（含博爾格拉德與多瑙河口北岸）割予摩爾達維亞，俄國失去多瑙河下游出海口與戰略前沿。此舉旨在削弱俄國對巴爾幹的壓力，以摩爾達維亞為緩衝；1878 年柏林會議才將此地歸還俄國。","detailZh":"南比薩拉比亞指多瑙河與普魯特河之間、原屬鄂圖曼的沿海地帶，1812 年被俄國併吞。克里米亞戰爭後，巴黎條約第 20、21 條規定俄國將該地（含博爾格拉德、卡胡爾、伊斯梅爾一帶）割予摩爾達維亞，俄國邊界北移至普魯特河。俄國因此失去多瑙河口與多瑙河艦隊基地，奧地利則取得在公國駐軍與影響的空間。對摩爾達維亞而言，這片土地增加其人口與出海口，卻也讓公國更直接暴露於大國競逐。條約同時規定多瑙河自由航行與國際委員會，確保商船通行。1878 年柏林會議後，俄國重新取得南比薩拉比亞，羅馬尼亞則換得北多布羅加，巴爾幹的領土補償邏輯延續下去。","terms":["Southern Bessarabia","Bolgrad","Danube Delta","Treaty of Paris"],"eraLabel":"Southern Bessarabia ceded"},{"id":"danubian_1856","year":1856,"dateLabel":"1856–1859","titleEn":"The Danubian Principalities","titleZh":"多瑙河公國與塞爾維亞","type":"treaty","summaryZh":"巴黎條約確立多瑙河公國（摩爾達維亞、瓦拉幾亞）的自治，由簽約國集體保證，並確認塞爾維亞自治。1858 年巴黎會議協調兩公國地位，1859 年庫扎當選兩公國大公，為羅馬尼亞統一鋪路。","detailZh":"巴黎條約第 22 至 28 條規定：摩爾達維亞與瓦拉幾亞在鄂圖曼宗主權下享有自治，其特權與豁免由簽約國集體保證；塞爾維亞的自治同樣受集體保證，鄂圖曼僅保留駐軍與宗主權象徵。1858 年列強在巴黎集會，試圖安排兩公國未來，決議以聯合公國名義選舉大公，但附帶限制。1859 年 1 月摩爾達維亞議會選出庫扎（Alexandru Ioan Cuza），2 月瓦拉幾亞議會跟進，兩公國形成共主邦聯，列強被迫默認。這一系列安排把巴爾幹問題國際化，也讓集體保證成為常態；但保證國之間的利益分歧，使公國得以在夾縫中推進統一，羅馬尼亞於 1861 年正式聯合。","terms":["collective guarantee","United Principalities","Alexandru Ioan Cuza","Convention of Paris 1858"],"eraLabel":"Danubian principalities"},{"id":"paris_1856","year":1856,"dateLabel":"Feb–Mar 1856","titleEn":"The Treaty of Paris","titleZh":"巴黎條約","type":"treaty","summaryZh":"1856 年 2 至 3 月巴黎和會召開，3 月 30 日簽訂巴黎條約：黑海中立化、俄國放棄對多瑙河公國與塞爾維亞的保護權、南比薩拉比亞歸摩爾達維亞、多瑙河自由航行。鄂圖曼領土完整受保證並納入歐洲公法，協調制度達到高峰。","detailZh":"巴黎和會由英法主導，奧地利、普魯士、俄國、鄂圖曼與薩丁尼亞參與，是 1815 年維也納會議以來最具代表性的國際會議。條約要點：黑海中立化，各國不得在黑海設海軍艦隊與軍港；俄國放棄對摩爾達維亞、瓦拉幾亞與塞爾維亞的單獨保護權，改由簽約國集體保證；南比薩拉比亞（含博爾格拉德）割予摩爾達維亞；多瑙河國際化並設歐洲多瑙河委員會；鄂圖曼帝國的獨立與領土完整納入歐洲公法，蘇丹被接納為歐洲協調的一員。會議同時發表宣言，廢除私掠船並規範海戰。然而黑海條款缺乏武力保證，只是大國暫時妥協的產物；法國主張召開會議的原則，也讓以會議處理爭端在形式上延續，實質上大國已各自追逐利益。","terms":["Treaty of Paris","Black Sea neutralization","Danubian Commission","Concert of Europe"],"eraLabel":"Treaty of Paris"},{"id":"italian_war_1859","year":1859,"dateLabel":"Apr–Jul 1859","titleEn":"The Second Italian War of Independence","titleZh":"第二次義大利獨立戰爭","type":"war","summaryZh":"1859 年薩丁尼亞與法國聯手對奧地利開戰。法軍在馬真塔與索爾費里諾擊敗奧軍，但傷亡慘重；拿破崙三世在維拉弗蘭卡片面停戰。戰爭使奧地利失去倫巴底，義大利中部諸邦爆發革命，統一運動全面展開。","detailZh":"1858 年 7 月，加富爾與拿破崙三世在普隆比耶爾密會，約定法國出兵助薩丁尼亞抗奧，薩丁尼亞以薩伏依與尼斯回報。1859 年 4 月奧地利發出最後通牒並進攻皮埃蒙特，法國參戰。6 月 4 日馬真塔之役，法軍在麥克馬洪指揮下險勝；6 月 24 日索爾費里諾之役雙方投入約三十萬人，奧軍敗退，但法軍傷亡逾萬。拿破崙三世震於戰爭殘酷與普魯士可能介入，7 月 11 日與法蘭茲·約瑟夫在維拉弗蘭卡單獨停戰，未與薩丁尼亞商量。此戰未經歐洲協調制度授權，奧地利被逐出義大利大部；法國以民族原則為名參戰，卻也顯示大國可為自身利益任意改寫 1815 年秩序。","terms":["Plombières agreement","Battle of Magenta","Battle of Solferino","Armistice of Villafranca"],"eraLabel":"Italian war of 1859"},{"id":"villafranca_zurich_1859","year":1859,"dateLabel":"Jul–Nov 1859","titleEn":"Villafranca and Zurich","titleZh":"維拉弗蘭卡停戰與蘇黎世條約","type":"treaty","summaryZh":"維拉弗蘭卡停戰協議與蘇黎世條約規定：倫巴底（曼圖亞、佩斯基耶拉除外）歸薩丁尼亞，威尼托仍屬奧地利；中義大利諸邦問題懸而未決。奧地利保留四角要塞，薩丁尼亞未獲威尼托，加富爾辭職抗議。","detailZh":"1859 年 7 月 11 日，拿破崙三世與法蘭茲·約瑟夫在維拉弗蘭卡會面，約定奧地利割倫巴底予法國、再由法國轉交薩丁尼亞，但保留曼圖亞與佩斯基耶拉；威尼托仍屬奧地利；中義大利諸邦恢復原狀。11 月 10 日蘇黎世條約確認上述安排，薩丁尼亞正式取得倫巴底（曼圖亞除外）。加富爾因未取得威尼托且未處理中義大利而辭職，但托斯卡尼、摩德納、帕爾馬與羅馬涅的革命政府拒絕復辟，並在 1860 年 3 月以公投併入薩丁尼亞。維拉弗蘭卡顯示大國可繞過小國與民族意願私下決定領土；蘇黎世條約則把戰爭結果條約化，卻無力恢復舊王朝，協調制度的正統原則已名存實亡。","terms":["Armistice of Villafranca","Treaty of Zurich","Quadrilateral fortresses","Lombardy"],"eraLabel":"Lombardy to Sardinia"},{"id":"central_italy_1860","year":1860,"dateLabel":"Mar 1860","titleEn":"Central Italy Joins Sardinia","titleZh":"中義大利併入薩丁尼亞","type":"unification","summaryZh":"1859 年戰爭後，托斯卡尼、摩德納、帕爾馬與羅馬涅的革命政府拒絕舊王朝復辟；1860 年 3 月舉行公投，壓倒性多數贊成併入薩丁尼亞。薩丁尼亞於 3 月 18 日宣布兼併，義大利中部統一完成，法國默許。","detailZh":"1859 年 4 至 6 月，托斯卡尼、摩德納、帕爾馬與教皇領的羅馬涅先後爆發革命，舊統治者出逃，成立臨時政府。維拉弗蘭卡協議名義上要求恢復原狀，但奧地利無力執行，英國亦支持民族意願。1860 年 3 月 11 至 12 日，四地舉行公投，絕大多數選民贊成併入薩丁尼亞；3 月 18 日薩丁尼亞國王維克多·艾曼紐二世頒布兼併令。拿破崙三世以薩伏依與尼斯為交換條件默許此事，但要求教皇保留羅馬。此後義大利半島僅剩威尼托、羅馬與兩西西里未入王國。以公投決定領土歸屬，直接挑戰維也納會議的正統原則，也讓民族自決成為改寫地圖的新依據。","terms":["plebiscite","Romagna","provisional governments","annexation"],"eraLabel":"Central Italy annexed"},{"id":"garibaldi_1860","year":1860,"dateLabel":"May–Nov 1860","titleEn":"Garibaldi's Expedition of the Thousand","titleZh":"加里波底千人遠征","type":"unification","summaryZh":"1860 年 5 月加里波底率千人遠征西西里，協助當地起義，連勝後渡海攻入那不勒斯。10 月在提亞諾與維克多·艾曼紐二世會面，將征服地獻給薩丁尼亞；公投後併入，兩西西里王國滅亡。","detailZh":"1860 年 4 月西西里爆發起義，加里波底召集約一千名志願者，5 月 11 日登陸馬爾薩拉，5 月 15 日在卡拉塔菲米擊敗波旁軍，5 月底進入巴勒莫。8 月渡過海峽登陸卡拉布里亞，9 月 7 日進入那不勒斯，國王法蘭西斯二世退守加埃塔。10 月 1 日沃爾圖諾河之役穩住局勢，10 月 26 日加里波底在提亞諾與維克多·艾曼紐二世會面，交出政權。10 月 21 日公投將兩西西里併入薩丁尼亞，1861 年 2 月加埃塔投降。加里波底未進攻羅馬，避免與法國衝突。這場由下而上的民族運動顯示，王朝外交已無法壟斷義大利統一進程。","terms":["Expedition of the Thousand","Marsala","Teano","Volturno"],"eraLabel":"Garibaldi's Thousand"},{"id":"savoy_nice_1860","year":1860,"dateLabel":"Mar–Apr 1860","titleEn":"The Treaty of Turin","titleZh":"都靈條約","type":"treaty","summaryZh":"1860 年 3 月 24 日都靈條約：薩丁尼亞將薩伏依與尼斯割予法國，作為法國同意其兼併中義大利的交換。4 月兩地公投確認歸屬，尼斯出生的加里波底強烈抗議。此交易使法國邊界推進至阿爾卑斯山。","detailZh":"都靈條約由加富爾與法國代表簽署：薩丁尼亞割讓薩伏依與尼斯，法國則承認薩丁尼亞對中義大利的兼併。條約延續 1858 年普隆比耶爾密約的補償邏輯，但名義上以人民的意願包裝，4 月 15 至 16 日的公投在法軍與薩丁尼亞官員監督下舉行，結果一面倒贊成歸法，遭到共和派與加里波底抨擊。尼斯是加里波底的故鄉，他終身拒絕承認割讓。條約另規定薩伏依北部（沙布萊、福西尼一帶）為中立區，瑞士對法國兼併薩伏依表示不滿。此案顯示大國以領土補償換取外交支持，是 1860 年代領土變更的典型模式。","terms":["Treaty of Turin","Savoy","Nice","plebiscite"],"eraLabel":"Savoy and Nice to France"},{"id":"italy_1861","year":1861,"dateLabel":"Mar 1861","titleEn":"The Kingdom of Italy","titleZh":"義大利王國成立","type":"unification","summaryZh":"1861 年 3 月 17 日義大利王國成立，維克多·艾曼紐二世為國王，加富爾任首相。王國採薩丁尼亞的憲法與行政體制，但不含威尼托與羅馬；教皇拒絕放棄世俗權力，法國駐軍羅馬，形成羅馬問題。","detailZh":"1861 年 2 月首屆義大利國會在杜林召開，3 月 17 日宣布義大利王國成立，維克多·艾曼紐二世為義大利國王。加富爾於 6 月病逝，王國由歷史右派主導。領土僅及半島大部：威尼托仍在奧地利手中，羅馬與拉齊奧由教皇統治並受法國駐軍保護。國會宣布羅馬為首都，卻無法收回，1865 年遷都佛羅倫斯作為折衷。教皇庇護九世拒絕承認新王國，並號召天主教徒抵制。義大利統一雖告完成大半，卻留下羅馬問題與外交孤立，只能等待 1866 年與普魯士結盟、1870 年法軍撤離的機會。","terms":["Kingdom of Italy","Roman Question","Piedmontese annexation","Cavour"],"eraLabel":"Kingdom of Italy"},{"id":"poland_1863","year":1863,"dateLabel":"Jan 1863 – 1864","titleEn":"The January Uprising","titleZh":"波蘭一月起義","type":"revolt","summaryZh":"1863 年 1 月波蘭反抗俄國統治的一月起義爆發，俄軍血腥鎮壓。英、法、奧聯合照會要求俄國讓步，普魯士則與俄簽阿爾文斯萊本公約合作。外交調停失敗，起義於 1864 年被鎮壓，波蘭問題退出大國議程。","detailZh":"1863 年 1 月 22 日，波蘭王國因反抗俄國徵兵令而爆發起義，游擊隊在鄉間活動，俄國總督穆拉維約夫以嚴酷手段鎮壓，大批起義者被處死或流放西伯利亞。2 月 8 日普魯士與俄國簽署阿爾文斯萊本公約，允許普軍越境追捕起義者，雖未經批准，卻暴露俄普合作。英、法、奧三國於 4 至 6 月聯合照會，要求俄國恢復波蘭自治，俄國拒絕，並以民族問題反制。調停失敗後，波蘭問題不再是歐洲協調的議題。此事件顯示：當大國利益一致時，協調制度可運作；當俄普聯手，英法奧的集體干涉毫無效果，協調制度的地緣基礎已鬆動。","terms":["January Uprising","Alvensleben Convention","Muravyov","diplomatic intervention"],"eraLabel":"Polish January Uprising"},{"id":"schleswig_1864","year":1864,"dateLabel":"Feb–Oct 1864","titleEn":"The Second Schleswig War","titleZh":"第二次什勒斯維希戰爭","type":"war","summaryZh":"1863 年丹麥通過十一月憲法兼併什勒斯維希，違反 1852 年倫敦議定書。普奧聯軍 1864 年進攻，迪伯爾要塞陷落；倫敦會議調停失敗。維也納條約使丹麥放棄什勒斯維希、霍爾斯坦與勞恩堡，普奧共管。","detailZh":"1852 年倫敦議定書確認丹麥國王為什勒斯維希、霍爾斯坦與勞恩堡的君主，並規定什勒斯維希不併入丹麥。1863 年 11 月丹麥議會通過十一月憲法，將什勒斯維希併入丹麥，觸怒德意志邦聯與民族主義輿論。普魯士首相俾斯麥拉攏奧地利共同出兵，1864 年 2 月普奧聯軍越過艾德河，4 月 18 日迪伯爾要塞陷落，6 月佔領阿爾斯島。4 至 6 月的倫敦會議因丹麥拒絕讓步而失敗，英法未出兵干預。10 月 30 日維也納條約：丹麥放棄三公國，普奧共管。這場戰爭使大國保證的領土秩序被公然撕毀，也為普奧衝突埋下伏筆。","terms":["November Constitution","Battle of Dybbøl","Treaty of Vienna 1864","London Conference"],"eraLabel":"Schleswig-Holstein war"},{"id":"gastein_1865","year":1865,"dateLabel":"Aug 1865","titleEn":"The Convention of Gastein","titleZh":"加斯坦專約","type":"treaty","summaryZh":"1865 年 8 月 14 日加斯坦專約：普魯士管理什勒斯維希，奧地利管理霍爾斯坦，勞恩堡由普魯士購得。此安排只是暫時妥協，奧地利在霍爾斯坦的立足點成為 1866 年衝突的導火線。","detailZh":"維也納條約後，普奧共管什勒斯維希-霍爾斯坦，行政與主權問題屢生摩擦。1865 年 8 月 14 日，俾斯麥與奧地利代表在加斯坦簽署專約：普魯士負責什勒斯維希，奧地利負責霍爾斯坦；奧地利將勞恩堡讓予普魯士，普魯士支付補償金；兩公國仍維持共管名義，霍爾斯坦的軍隊與港灣問題懸而未決。奧地利在霍爾斯坦的行政權，使其在德意志邦聯議會中得以介入北方事務，也讓普魯士有了挑起衝突的藉口。加斯坦安排繞過邦聯議會與公眾，以雙邊密約處置小邦命運，進一步削弱協調制度的公信力；1866 年 6 月，普魯士即以霍爾斯坦問題為由進軍。","terms":["Convention of Gastein","Lauenburg","condominium","Holstein"],"eraLabel":"Gastein Convention"},{"id":"prague_1866","year":1866,"dateLabel":"Aug 1866","titleEn":"The Treaty of Prague","titleZh":"布拉格條約","type":"treaty","summaryZh":"1866 年 8 月 23 日布拉格條約：德意志邦聯解散，普魯士兼併漢諾威、黑森選侯國、拿騷、法蘭克福與什勒斯維希-霍爾斯坦；奧地利退出德意志事務。威尼托經法國轉交義大利，普魯士成為德意志主導力量。","detailZh":"布拉格條約是普奧戰爭的正式結束。條約規定：德意志邦聯解散；普魯士兼併漢諾威、黑森選侯國、拿騷、法蘭克福自由市以及什勒斯維希-霍爾斯坦；奧地利承認普魯士在北德意志的領導地位，退出德意志事務；奧地利將威尼托割予法國，再由法國轉交義大利；薩克森等邦保留但須加入新的北德意志邦聯；南德諸邦（巴伐利亞、符騰堡、巴登、黑森-達姆施塔特南部）維持獨立，另與普魯士簽訂秘密攻守同盟。普魯士未索取奧地利領土，以免激起報復，俾斯麥的克制使奧地利日後可能親德。此條約徹底改寫 1815 年以來的德意志秩序，協調制度對德意志事務的約束力蕩然無存。","terms":["Treaty of Prague","dissolution of the German Confederation","annexations","North German Confederation"],"eraLabel":"Confederation dissolved"},{"id":"prussian_austrian_war_1866","year":1866,"dateLabel":"Jun–Jul 1866","titleEn":"The Austro-Prussian War","titleZh":"普奧戰爭","type":"war","summaryZh":"1866 年 6 月普奧戰爭爆發，普魯士退出德意志邦聯，進攻漢諾威、薩克森與波希米亞。7 月 3 日柯尼希格雷茨決戰，普軍以鐵路與電報動員優勢大勝；義大利同時在威尼托作戰失利。7 月 26 日簽尼科爾斯堡初步和約。","detailZh":"普奧戰爭（德意志邦聯戰爭）源於什勒斯維希-霍爾斯坦爭議與德意志領導權之爭。1866 年 6 月 14 日邦聯議會通過動員，普魯士宣布邦聯解體，出兵漢諾威、薩克森與黑森。普軍在蘭根薩爾察與漢諾威軍交戰，漢諾威軍雖獲戰術勝利，仍於 6 月 29 日被圍投降；7 月 3 日於柯尼希格雷茨（薩多瓦）與奧軍決戰：毛奇集中三個軍團，以電報與鐵路完成迅速動員，奧軍統帥貝內德克戰敗，損失慘重。義大利依約在南部進攻，卻在庫斯托扎失利、利薩海戰受挫。7 月 26 日普奧簽尼科爾斯堡初步和約，8 月 23 日布拉格條約。此戰證明普魯士的軍事與工業優勢，而奧地利被排除於德意志之外；歐洲協調制度對德意志內戰幾乎無從介入。","terms":["Königgrätz","Moltke","Nikolsburg","Bundestag"],"eraLabel":"Königgrätz campaign"},{"id":"venetia_1866","year":1866,"dateLabel":"Oct–Nov 1866","titleEn":"Venetia Joins Italy","titleZh":"威尼托歸義大利","type":"treaty","summaryZh":"普奧戰爭後，奧地利依布拉格條約將威尼托割予法國，法國於 1866 年 10 月轉交義大利；11 月公投確認併入義大利王國，威尼托與曼圖亞一併歸義。義大利至此完成半島領土的主體統一。","detailZh":"1866 年 6 月義大利依與普魯士的同盟參戰，雖在庫斯托扎與利薩受挫，卻因普軍在柯尼希格雷茨大勝而得利。布拉格條約規定奧地利將威尼托割予法國，10 月 3 日奧法簽維也納條約確認，10 月 19 日法國將威尼托移交義大利；10 月 21 至 22 日公投，絕大多數贊成併入義大利王國，11 月正式兼併，曼圖亞與四角要塞亦隨之移交。拿破崙三世以中間人角色換取外交聲望，卻被義大利民族主義者視為多餘的干預。義大利以戰爭外交完成統一的一大步，證明小國可藉大國衝突獲利；而奧地利失去義大利最後據點，轉向巴爾幹與內部改革。","terms":["Treaty of Vienna 1866","plebiscite","Venetia","Quadrilateral"],"eraLabel":"Venetia to Italy"},{"id":"ausgleich_1867","year":1867,"dateLabel":"Feb–Jun 1867","titleEn":"The Austro-Hungarian Compromise","titleZh":"奧匈折衷方案","type":"dynastic","summaryZh":"1867 年奧匈折衷方案：奧地利帝國改組為奧匈二元君主國，匈牙利取得內政自治，法蘭茲·約瑟夫兼匈牙利國王；外交、國防與財政共同。此舉鞏固哈布斯堡統治，卻加深境內斯拉夫民族的不滿。","detailZh":"1866 年普奧戰爭失敗後，奧地利必須安撫匈牙利以穩定帝國。1867 年 2 月匈牙利議會通過折衷方案，3 月奧地利議會跟進，6 月 8 日法蘭茲·約瑟夫在布達佩斯加冕為匈牙利國王。奧匈二元君主國由奧地利與匈牙利兩個平等部分組成：外交、國防與共同財政由共同部長會議處理，內政各自獨立；1867 年 12 月奧地利部分頒布十二月憲法，確立自由主義法治。1868 年又與克羅埃西亞達成納戈德巴協議，給予有限自治。折衷方案讓帝國度過危機，卻使捷克、塞爾維亞等斯拉夫民族被排除於權力之外，民族矛盾日後成為帝國解體的主因。奧地利退出德意志後，外交重心轉向巴爾幹。","terms":["Ausgleich","Dual Monarchy","December Constitution","Nagodba"],"eraLabel":"Austro-Hungarian Compromise"},{"id":"luxembourg_1867","year":1867,"dateLabel":"Apr–May 1867","titleEn":"The Luxembourg Crisis","titleZh":"盧森堡危機","type":"crisis","summaryZh":"1867 年拿破崙三世試圖向荷蘭國王購買盧森堡，俾斯麥反對，普魯士駐軍使危機升高。5 月倫敦會議簽訂倫敦條約：盧森堡中立化、普軍撤出、要塞拆除，列強集體保證其中立。此後盧森堡成為歐洲中立體系的一環。","detailZh":"盧森堡自 1815 年起與荷蘭共戴一君，並加入德意志邦聯，普魯士在盧森堡市駐軍。1866 年邦聯解散後，拿破崙三世於 1867 年 3 月向荷蘭國王威廉三世提出購買盧森堡，俾斯麥強烈反對，戰爭危機一觸即發。5 月 11 日列強在倫敦簽署條約：盧森堡永久中立，由簽約國集體保證；普魯士撤軍，要塞拆除；盧森堡仍與荷蘭共戴一君，直到 1890 年。此危機被視為歐洲協調制度最後一次成功運作，大國以會議避免戰爭；但法國未獲補償，普魯士威望受損，雙方敵意加深，為 1870 年普法戰爭鋪路。","terms":["Luxembourg Crisis","Treaty of London 1867","neutrality","personal union"],"eraLabel":"Luxembourg neutralized"},{"id":"ngc_1867","year":1867,"dateLabel":"1866–1867","titleEn":"The North German Confederation","titleZh":"北德意志邦聯成立","type":"unification","summaryZh":"1867 年北德意志邦聯成立：普魯士主導，俾斯麥任聯邦總理，設聯邦參議院與普選產生的帝國議會，成員含 22 邦與 3 個自由市。南德諸邦留在邦聯之外，但與普魯士簽有秘密攻守同盟。","detailZh":"1866 年 8 月，普魯士與北德各邦簽訂條約，1867 年 2 月選出制憲議會，4 月 16 日通過憲法，7 月 1 日生效。北德意志邦聯由普魯士國王擔任聯邦主席，俾斯麥任聯邦總理；聯邦參議院由各邦代表組成，普魯士握有否決關鍵；帝國議會由成年男子普選產生，但權限有限。成員包括薩克森、漢堡、不來梅、呂貝克等 22 邦與 3 自由市。南德的巴伐利亞、符騰堡、巴登與黑森-達姆施塔特南部未加入，但與普魯士簽有秘密攻守同盟，戰時軍隊歸普軍指揮。此架構是 1871 年德意志帝國的藍本，也讓普魯士得以在民族主義旗幟下整合北德；歐洲協調制度對此既成事實只能默認。","terms":["North German Confederation","Bundesrat","Reichstag","Bundeskanzler"],"eraLabel":"North German Confederation"},{"id":"black_sea_1870","year":1870,"dateLabel":"Oct 1870 – Mar 1871","titleEn":"The Black Sea Question","titleZh":"黑海中立化爭議","type":"crisis","summaryZh":"1870 年 10 月 31 日，俄國外相戈爾查科夫趁普法戰爭宣布不再受 1856 年巴黎條約黑海條款約束。列強抗議後召開倫敦會議，1871 年 3 月 13 日倫敦條約廢除黑海中立化，俄國恢復黑海艦隊，但確認鄂圖曼領土完整。","detailZh":"1856 年巴黎條約規定黑海中立化，禁止俄國在黑海設海軍艦隊與軍港。1870 年 10 月 31 日，俄國外相戈爾查科夫發表通告，宣布該條款已不符情勢，俄國不再受其約束，此舉趁普法戰爭列強無暇他顧。英國、奧地利強烈抗議，俾斯麥則建議召開會議。1871 年 1 至 3 月倫敦會議召開，3 月 13 日簽署倫敦條約：廢除巴黎條約第 11、13、14 條，黑海中立化終止，俄國可重建黑海艦隊；同時確認海峽在和平時期對外國軍艦關閉的原則，並重申鄂圖曼領土完整。俄國以片面聲明達到目的，協調制度無力制裁，只換得形式上的會議背書，象徵 1856 年體系終結。","terms":["Gorchakov circular","Black Sea clauses","Treaty of London 1871","denunciation"],"eraLabel":"Black Sea clauses revoked"},{"id":"franco_prussian_1870","year":1870,"dateLabel":"Jul 1870 – Jan 1871","titleEn":"The Franco-Prussian War","titleZh":"普法戰爭","type":"war","summaryZh":"1870 年 7 月普法戰爭爆發。普軍在維桑堡、沃爾特與格拉沃洛特連勝，9 月 2 日色當戰役俘虜拿破崙三世，第二帝國崩潰；9 月 19 日包圍巴黎，10 月 27 日梅斯投降。1871 年 1 月巴黎停戰，德意志帝國在凡爾賽成立。","detailZh":"普法戰爭是 1870 年代歐洲最重要的一場戰爭。8 月 4 日普軍攻下維桑堡，8 月 6 日沃爾特與斯皮舍倫之役大勝，8 月 18 日格拉沃洛特-聖普里瓦血戰後法軍退守梅斯。9 月 1 日色當戰役，麥克馬洪軍團被圍，9 月 2 日拿破崙三世率十萬餘人投降，第二帝國滅亡；9 月 4 日巴黎宣布成立國防政府。9 月 19 日普軍包圍巴黎，10 月 27 日巴贊元帥在梅斯投降，12 月奧爾良等地仍有抵抗。1871 年 1 月 18 日德意志帝國在凡爾賽鏡廳宣告成立，1 月 28 日巴黎停戰，2 月 26 日簽初步和約，3 月 1 日德軍短暫進入巴黎。此戰未經任何歐洲會議，勝者直接決定結局，協調制度已無力約束。","terms":["Battle of Sedan","Siege of Metz","Siege of Paris","Gravelotte"],"eraLabel":"War with France"},{"id":"hohenzollern_1870","year":1870,"dateLabel":"Jul 1870","titleEn":"The Hohenzollern Candidacy","titleZh":"霍亨索倫候選與艾姆斯電報","type":"crisis","summaryZh":"1868 年西班牙革命後王位懸空，1870 年霍亨索倫家族的利奧波德在俾斯麥鼓勵下接受候選，法國強烈反對。利奧波德撤回後，法國仍要求威廉一世保證，艾姆斯電報經俾斯麥刪改激化局勢，法國於 7 月 19 日宣戰。","detailZh":"1868 年西班牙光榮革命推翻伊莎貝拉二世，1869 年制憲後尋找新君主。1870 年 7 月，霍亨索倫-錫格馬林根的利奧波德在俾斯麥與西班牙首相普里姆安排下接受候選，法國外相格拉蒙認為此舉將使法國兩面受敵，強烈抗議。7 月 12 日利奧波德在法國壓力下撤回，但法國要求威廉一世承諾永不再支持霍亨索倫候選。7 月 13 日威廉一世在艾姆斯拒絕，並授權將過程電告俾斯麥；俾斯麥刪改電文、使其語氣強硬後公布，激起兩國民族主義。7 月 19 日法國宣戰。這場危機顯示：外交誤判與輿論動員可以把王朝繼承問題變成戰爭藉口，協調制度毫無介入空間。","terms":["Hohenzollern candidacy","Ems Dispatch","Leopold of Hohenzollern","Gramont"],"eraLabel":"Ems Dispatch"},{"id":"rome_1870","year":1870,"dateLabel":"Sep–Oct 1870","titleEn":"The Annexation of Rome","titleZh":"羅馬併入義大利","type":"unification","summaryZh":"1870 年 9 月 20 日義大利軍隊攻入羅馬，教皇庇護九世退居梵蒂岡，世俗權終結；10 月公投將羅馬併入義大利，1871 年遷都羅馬。法國因普法戰爭撤回駐軍，是義大利得以行動的關鍵。","detailZh":"羅馬自 1849 年以來由教皇統治，並有法國駐軍保護。1870 年 8 月普法戰爭爆發，法國撤回駐羅馬軍隊，義大利政府決定行動。9 月 20 日，卡多納將軍率軍攻破庇亞門，佔領羅馬，教皇庇護九世退居梵蒂岡，自稱梵蒂岡之囚。10 月 2 日公投以壓倒多數贊成併入義大利；1871 年義大利議會通過保證法，承認教皇人身不可侵犯並給予年金，但教皇拒絕接受。1871 年義大利遷都羅馬。羅馬問題成為義大利與天主教世界關係的長期裂痕，直到 1929 年拉特蘭條約才解決。義大利趁大國戰爭之際完成統一，正是協調制度失靈的另一寫照。","terms":["Porta Pia","Law of Guarantees","Roman Question","Papal States"],"eraLabel":"Rome annexed"},{"id":"concert_collapse","year":1871,"dateLabel":"1853–1871","titleEn":"The Collapse of the Concert of Europe","titleZh":"歐洲協調制度的瓦解","type":"crisis","summaryZh":"1815 年維也納會議建立的歐洲協調制度，以四大國一致與條約保證維持秩序。1853 至 1871 年間，克里米亞、義大利、德意志一系列戰爭皆未經協調，領土由戰勝國逕行決定。1871 年後均勢改由新興德意志帝國主導，協調制度名存實亡。","detailZh":"歐洲協調制度源於 1815 年維也納會議，由英、俄、奧、普等大國以會議協商處理危機，強調條約神聖、正統主義與均勢。1856 年巴黎會議是其高峰：大國共同保證鄂圖曼領土完整、黑海中立化。但黑海條款缺乏執行力，1859 年義大利戰爭、1863 年波蘭起義、1864 年什勒斯維希戰爭皆顯示大國可為自身利益繞過協調；1866 年普奧戰爭與 1870 年普法戰爭更直接以武力重塑地圖。1871 年倫敦會議雖保住形式，法蘭克福條約卻由戰勝國單方決定，德意志帝國在凡爾賽成立，權力重心轉移至柏林。1880 年代以前協調制度仍偶爾運作，如 1878 年柏林會議，但已非主導力量；一戰前夕的巴爾幹危機終於顯露其徹底破產。","terms":["Concert of Europe","balance of power","Vienna Congress","great-power congress"],"eraLabel":"Concert of Europe collapses"},{"id":"frankfurt_1871","year":1871,"dateLabel":"May 1871","titleEn":"The Treaty of Frankfurt","titleZh":"法蘭克福條約","type":"treaty","summaryZh":"1871 年 5 月 10 日法蘭克福條約：法國割讓亞爾薩斯-洛林（貝爾福除外），賠款 50 億法郎，分期三年付清，德軍佔領法國北部至付清為止。法國承認德意志帝國，歐洲均勢徹底改變。","detailZh":"法蘭克福條約結束普法戰爭。法國割讓亞爾薩斯（下萊茵、上萊茵，貝爾福除外）與洛林部分（梅斯、蒂永維爾一帶），合稱帝國直轄領亞爾薩斯-洛林；賠款 50 億法郎，三年內付清，德軍佔領法國北部部分地區作為擔保，1873 年付清後撤軍。條約未經國際會議，由戰勝國單方面擬定，與 1856 年巴黎會議的多邊形式形成強烈對比。割地與巨額賠款在法國留下深刻的復仇情緒，也讓德國兼併說德語地區卻帶入大量法語人口，成為日後衝突的根源。對歐洲協調制度而言，這是一記喪鐘：大國不再以會議維持均勢，而是以戰爭與條約直接塑造秩序。","terms":["Treaty of Frankfurt","Alsace-Lorraine","indemnity","Reichsland"],"eraLabel":"Treaty of Frankfurt"},{"id":"german_empire_1871","year":1871,"dateLabel":"Jan 1871","titleEn":"The German Empire","titleZh":"德意志帝國成立","type":"unification","summaryZh":"1871 年 1 月 18 日，德意志諸邦在凡爾賽宮鏡廳宣布成立德意志帝國，威廉一世為德意志皇帝，俾斯麥為帝國總理。帝國採聯邦制，普魯士居主導地位，4 月通過帝國憲法。德意志統一完成，歐洲均勢改寫。","detailZh":"1871 年 1 月 18 日，德意志各邦君主與軍政要員在凡爾賽宮鏡廳集會，宣布德意志帝國成立，普魯士國王威廉一世加冕為德意志皇帝。此舉刻意選在法國王宮，象徵戰勝與羞辱。4 月 16 日帝國憲法通過：帝國由 25 個邦與亞爾薩斯-洛林直轄領組成，設聯邦參議院與普選的帝國議會；皇帝掌外交與軍權，首相俾斯麥實際主政。普魯士以三分之二人口與壓倒性軍事力量主導帝國。德意志統一採小德意志方案，排除奧地利，完成 1848 年以來民族主義者的目標。對歐洲而言，一個人口與工業實力居大陸之首的新強權誕生，1815 年以來的均勢與協調制度正式走入歷史。","terms":["Hall of Mirrors","German Emperor","Reichskanzler","Kleindeutschland"],"eraLabel":"German Empire proclaimed"}],"regionNotes":{"lombardy":"1859 年蘇黎世條約後，倫巴底（曼圖亞、佩斯基耶拉除外）由奧地利歸薩丁尼亞，1861 年起屬義大利王國。","venetia":"1866 年普奧戰爭後，奧地利經法國將威尼托轉交義大利，11 月公投併入，曼圖亞一併歸義。","savoy_nice":"1860 年都靈條約割予法國，經 4 月公投確認；薩伏依北部保留中立區，瑞士曾抗議。","tuscany":"1859 年革命、大公出逃；1860 年 3 月公投併入薩丁尼亞，1861 年起屬義大利。","modena":"1859 年革命、公爵出逃；1860 年 3 月公投併入薩丁尼亞，1861 年起屬義大利。","parma":"1859 年革命、公爵出逃；1860 年 3 月公投併入薩丁尼亞，1861 年起屬義大利。","papal_romagna":"教皇領北部（波隆那、費拉拉等），1859 年革命後由臨時政府掌權，1860 年 3 月公投併入薩丁尼亞。","papal_marche_umbria":"1860 年 9 月皮埃蒙特軍隊越境擊敗教皇軍（卡斯特爾菲達多），馬爾凱與翁布里亞併入薩丁尼亞。","papal_lazio":"教皇國僅餘領土，1870 年 9 月 20 日羅馬被義大利佔領，10 月公投併入，教皇退居梵蒂岡。","two_sicilies":"1860 年加里波底遠征推翻波旁政權，公投併入薩丁尼亞；1861 年加埃塔陷落，王國滅亡。","schleswig":"1864 年丹麥放棄，普奧共管；1865 年加斯坦歸普魯士管理，1866 年併入普魯士。","holstein":"1864 年歸普奧共管，1865 年加斯坦歸奧地利；1866 年普奧戰爭後歸普魯士，1867 年併入什勒斯維希-霍爾斯坦省。","hanover":"1866 年與奧地利同盟戰敗，被普魯士兼併，成為漢諾威省，1871 年隨普魯士加入德意志帝國。","hesse_kassel":"1866 年支持奧地利，戰後被普魯士兼併，併入黑森-拿騷省。","nassau":"1866 年與奧地利同盟，戰後被普魯士兼併，併入黑森-拿騷省。","alsace_lorraine":"1871 年法蘭克福條約割予德意志帝國，設為帝國直轄領；貝爾福因抵抗而保留在法國。","south_bessarabia":"1856 年巴黎條約由俄國割予摩爾達維亞，1878 年柏林會議歸還俄國。","greece":"1864 年英國將愛奧尼亞群島割予希臘；希臘領土大體穩定，大希臘主義持續主張擴張。","serbia":"1856 年巴黎條約確認自治，1867 年鄂圖曼撤軍，1878 年獨立並擴張。","romania":"1859 年兩公國合選庫扎，1861 年聯合、1862 年稱羅馬尼亞，1866 年卡羅爾一世即位。","montenegro":"1852 年成為世俗公國，與鄂圖曼衝突不斷，1878 年獨立並獲領土。","luxembourg":"1867 年倫敦條約中立化，普軍撤出；與荷蘭共戴一君至 1890 年。"}};

<script>
/* Europe 1853-1871 — interactive historical atlas
 * Rendering core: Lambert Conformal Conic projection, region fills, shared-boundary

(function () {
  'use strict';

  var D = window.DATA, META = D.meta, NS = 'http://www.w3.org/2000/svg';
  var ERAS = META.eras, Y0 = META.years[0], Y1 = META.years[1];
  var W = META.view.w, H = META.view.h, PJ = META.proj;
  var RAD = Math.PI / 180;

  /* ---------------------------------------------------------------- projection */
  var LCC_N = Math.log(Math.cos(PJ.phi1 * RAD) / Math.cos(PJ.phi2 * RAD)) /
    Math.log(Math.tan(Math.PI / 4 + PJ.phi2 * RAD / 2) / Math.tan(Math.PI / 4 + PJ.phi1 * RAD / 2));
  var LCC_F = Math.cos(PJ.phi1 * RAD) * Math.pow(Math.tan(Math.PI / 4 + PJ.phi1 * RAD / 2), LCC_N) / LCC_N;
  var RHO0 = LCC_F / Math.pow(Math.tan(Math.PI / 4 + PJ.phi0 * RAD / 2), LCC_N);

  function toSvg(lon, lat) {
    var rho = LCC_F / Math.pow(Math.tan(Math.PI / 4 + lat * RAD / 2), LCC_N);
    var th = LCC_N * (lon - PJ.lam0) * RAD;
    var x = rho * Math.sin(th), y = RHO0 - rho * Math.cos(th);
    return [(x - PJ.xmin) / (PJ.xmax - PJ.xmin) * W, (PJ.ymax - y) / (PJ.ymax - PJ.ymin) * H];
  }
  function toLonLat(sx, sy) {
    var x = PJ.xmin + sx / W * (PJ.xmax - PJ.xmin);
    var y = PJ.ymax - sy / H * (PJ.ymax - PJ.ymin);
    var dy = RHO0 - y, rho = Math.hypot(x, dy), th = Math.atan2(x, dy);
    return [PJ.lam0 + th / LCC_N / RAD,
      2 * Math.atan(Math.pow(LCC_F / rho, 1 / LCC_N)) / RAD - 90];
  }

  /* ---------------------------------------------------------------- helpers */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var ENT = {}, ENT_INDEX = {};
  D.entities.forEach(function (e, i) { ENT[e.id] = e; ENT_INDEX[e.id] = i; });
  var REG = D.regions, NR = REG.length;
  var FRAME_BY_ID = {};
  D.frames.forEach(function (f) { FRAME_BY_ID[f.id] = f; });

  var st = {

  function cloneRings() {

  st.rings = cloneRings();

  function eraOf(year) { var e = 0; for (var i = 0; i < ERAS.length; i++) if (year >= ERAS[i]) e = i; return e; }

  /* ---------------------------------------------------------------- svg scaffold */
  var svg = $('#map');

  var gLand = mk('g', { id: 'land-layer' });
  var gCtx = mk('g', { id: 'ctx-layer' });
  var gRegion = mk('g', { id: 'region-layer' });
  var gEdge = mk('g', { id: 'edge-layer' });
  var gFrame = mk('g', { id: 'frame-layer' });
  var gEdit = mk('g', { id: 'edit-layer' });
  var gLabel = mk('g', { id: 'label-layer' });
  [seaRect, gLand, gCtx, gRegion, gFrame, gEdge, gEdit].forEach(function (n) { viewport.appendChild(n); });
  svg.appendChild(gLabel);

  /* land + context */
  function ringsToPath(rings) {

    for (var i = 0; i < rings.length; i++) {

      }
      out += 'Z';
    }
    return out;
  }
  var landPath = mk('path', { 'class': 'parchment', d: ringsToPath(D.land) });
  gLand.appendChild(landPath);
  var ctxPaths = D.context.map(function (c) {
    var p = mk('path', {

  });

  /* regions */
  var regionEls = [], projCache = [];
  function refreshRegion(i) {
    var rr = st.rings[i], out = [];

  }
  function pathOf(i) {
    var rings = projCache[i], out = '';
    for (var r = 0; r < rings.length; r++) {
      var ring = rings[r];
      out += 'M';
      for (var k = 0; k < ring.length; k++) {
        out += (k ? 'L' : '') + ring[k][0].toFixed(1) + ',' + ring[k][1].toFixed(1);

    var p = mk('path', { 'class': 'region', d: pathOf(i) });

    p.setAttribute('stroke-width', '0.6');

    var d = 'M';
    for (var k2 = 0; k2 < pr.length; k2++) d += (k2 ? 'L' : '') + pr[k2][0].toFixed(1) + ',' + pr[k2][1].toFixed(1);
    return d;
  });
  var edgeEls = edgeProj.map(function (d) {
    var p = mk('path', { d: d, fill: 'none', 'class': 'edge', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    gEdge.appendChild(p);
    return p;
  });

  /* frames */
  var frameEls = {}, frameLabels = {};
  D.frames.forEach(function (f) {
    var p = mk('path', { fill: 'none', stroke: f.color, 'stroke-width': '1.7', 'class': 'fr' });
    gFrame.appendChild(p);
    frameEls[f.id] = p;

  /* ---------------------------------------------------------------- label layer */
  var labelBoxes = [];
  function bboxAt(node, x, y) {
    var b;
    try { b = node.getBBox(); } catch (err) { return null; }
